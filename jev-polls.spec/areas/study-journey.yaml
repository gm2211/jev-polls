id: study-journey
name: Main study journey
prose: >-
  The path from a new project to a running study. Each screen leads into the next: create a
  project, land on its studies, open a study's canvas, add rounds on it, give each round a
  cohort (creating one on the spot if needed), then review and run. Requested 2026-10-09 by Giulio
  after "Draft pipeline" sat alone beside the first-study form. The detailed shape below (sidebar,
  railway.com-style canvas, slide-over round panel) is the proposal shown in the "Jev study flow"
  mockups (https://claude.ai/artifact/EEEqHfDTj9tfMt6znpooZr); it is being built in small PRs and
  stays open to revision. "Voting round" in the user's words is the existing Ask cohort step.
behaviors:
  - id: project-lands-on-studies
    description: >-
      Opening a project that already holds two or more studies lands on its Studies list; an empty
      list offers to create the first study. A project with fewer studies lands on a canvas
      (project-lands-on-canvas).
    details: >-
      Narrowed on 2026-10-10: the original rule sent every new project to the studies list, which
      meant an extra screen before the first question.
    source:
      text: >-
        I create a project -> right away list of studies or create new if none presetn (look up
        examples online of ux for empty lists and create new by just clicking empty list e.g.)
      reference: jev-polls project thread "Rethink the main user flow", Giulio, 2026-10-09
  - id: project-lands-on-canvas
    description: >-
      Creating a project, or opening one that has no study, goes straight to a new empty study canvas:
      the study ("Study 1") is created on the spot with its title editor focused. A project with
      exactly one study opens that study. Neither visits the Studies or Cohorts pages first.
    details: >-
      The Studies list stays one click away in the sidebar and breadcrumbs. Reopening a project
      whose only study is still empty opens that study instead of creating another. Creating a study
      from the list gives the same empty canvas. Part of the one-minute guided demo path: New project
      to Run study on the canvas and its slide-over only (guided-demo-path). Earlier brief, 2026-10-09: "I create a project -> right away list of studies or create new if none present -> pipeline editor railway-style".
    source:
      text: >-
        there is no guided flow - I have to know about cohorts - I had told you I want an experience
        like railway.com.
      reference: jev-polls project thread, Giulio, 2026-10-10
  - id: empty-canvas-entry-points
    description: >-
      An empty study canvas offers two entry points on the canvas itself: a large "Add your first
      question" target and a "Describe the study in words" target that opens Build with words.
      Clicking anywhere else on the empty canvas also adds the first question.
    details: >-
      Replaces the small "Add question" button. The first question takes the study question as its
      text when the study already has one. Review run is not offered until a step exists.
    source:
      text: >-
        there is no guided flow - I have to know about cohorts - I had told you I want an experience
        like railway.com.
      reference: jev-polls project thread, Giulio, 2026-10-10
  - id: guided-demo-path
    description: >-
      From New project to Run study, everything happens on the study canvas and its slide-over: no
      visit to the Cohorts, Studies or Settings pages and, where avoidable, no separate Review page.
    details: >-
      Acceptance bar for the guided flow (project-lands-on-canvas, empty-canvas-entry-points,
      guided-step-setup, inline-audience-creation, single-next-action). Each guided-flow pull
      request reports the exact click path and the screens it touches.
    source:
      text: >-
        you must be able to produce a 1 minute demo that shows very simple, streamlined, almost
        guided process, without needing to jump between screens and with a compelling live voting
        view
      reference: jev-polls project thread, Giulio, 2026-10-10
  - id: empty-list-creates
    description: >-
      An empty studies or cohorts list is itself the create control: clicking anywhere in it
      creates the item and opens it, with no intermediate form.
    details: >-
      A non-empty cohorts list keeps a create row at its end and a create button on the title line; the studies list keeps only the title-line button (studies.one-new-study-button). A new
      study is named by its question at the top of the study. Draft with assistant is offered on
      the study rather than as a floating page button.
    source:
      text: create new by just clicking empty list
      reference: jev-polls project thread "Rethink the main user flow", Giulio, 2026-10-09
  - id: railway-track
    description: >-
      A study opens as a railway.com-style canvas: rounds are cards on a dotted canvas, wired by
      their outputs, each showing its type, question, a status dot and who answers.
    details: >-
      Rounds are added from a Create control in the canvas corner or by clicking empty canvas,
      and no standing instructions banner sits above the canvas; free placement and drag remain (studies.canvas-drag-nodes, studies.canvas-click-create).
      The user clarified that "railway" means railway.com, so this is a canvas, not a literal
      track.
    source:
      text: >-
        pipeline editor railway-style from which I branch into creating a voting round with types,
        inputs, outputs
      reference: jev-polls project thread "Rethink the main user flow", Giulio, 2026-10-09
  - id: round-panel
    description: >-
      Selecting a round slides a panel over the canvas with one row of tabs (Question, Answers,
      Inputs, Cohort), each marked when it still needs attention; Esc or a close control hides it.
    details: >-
      Modeled on railway.com's service panel. Answers also lists what later rounds can use as
      inputs. Selecting another round, adding one, or connecting an input reopens the panel.
    source:
      text: creating a voting round with types, inputs, outputs and which needs a cohort assigned
      reference: jev-polls project thread "Rethink the main user flow", Giulio, 2026-10-09
  - id: inline-cohort-create
    description: >-
      A round's Cohort tab offers New cohort, built inside the panel; accepting it adds it to the
      shared library, links it to the project, assigns it to the round, and shows the Cohort tab
      again with it selected.
    details: >-
      Back to cohorts returns to the cohort list without changes. With a cohort assigned, the tab
      offers Open full cohort (the detailed editor, with a way back to the study) and Change cohort.
    source:
      text: needs a cohort assigned that I can create right there and then and navigate back to pipeline
      reference: jev-polls project thread "Rethink the main user flow", Giulio, 2026-10-09
  - id: review-run-to-fix
    description: >-
      While steps are unfinished, the study header's primary action reads "Review run · N to fix"
      and opens the first unfinished step's panel on the tab that fixes it; with nothing left it
      opens the run review.
    details: Proposal shown in the "Jev study flow" mockups (step 5); the run review page is described in review-run-page.
    source:
      text: the user flows aren't flowing at the moment
      reference: jev-polls project thread "Rethink the main user flow", Giulio, 2026-10-09
  - id: project-sidebar
    description: >-
      Inside a project, a sidebar holds the way back to all projects, the project name, Studies
      (with each study nested beneath it), Cohorts, Runs and Settings, each section with its count.
    details: >-
      The open section or study is marked current. On narrow screens the sidebar becomes a single
      scrollable row above the page and nested studies are hidden.
    source:
      text: >-
        also consider something like this as a possible layout inspiration (it's still not
        perfect, but navigation tabs here are in a sidebar)
      reference: >-
        jev-polls project chat, Giulio, 2026-10-09, with screenshots of the TypeSafe AI console;
        follows "while I generally love tabbed uis, the way this is structured is confusing"
  - id: inline-edit-single-save
    description: >-
      Inline edits of a study question or project name have no check or cancel buttons: Enter
      saves the change, Esc or clicking away discards it, and a short hint says so.
    details: >-
      Keeps the page's Save as the only save button beside the field. Esc in the field does not
      close the step panel. Giulio corrected an earlier version that kept the edit on click-away:
      "clicking outside is implied X discard" (2026-10-09).
    source:
      text: this looks super weird - double save
      reference: >-
        jev-polls project chat, Giulio, 2026-10-09, with screenshots of the study question field
        showing check and cancel icons beside Save
  - id: step-settings-no-repeat
    description: >-
      Step settings never repeat the study question: the page heading and last crumb both read
      "Step N settings".
    details: >-
      First shipped as a "Step N settings" label beside a Back to flow button; replaced the same day
      by breadcrumb levels (navigation.breadcrumbs).
    source:
      text: weird repetition
      reference: >-
        jev-polls project chat, Giulio, 2026-10-09, with a screenshot of the study title repeated
        in "Step settings · 1. <same question>"
  - id: answer-kind-first
    description: >-
      Editing an Ask cohort step starts with "What kind of answer?": Yes / no, Compare options or
      Ordered scale, each with a one-line explanation, before the question text, name or personas.
    details: >-
      Shown first on the step panel's Question tab and in Step settings. The app has no separate
      ranking type; Compare options ranks the options by preference, and its hint says so.
    source:
      text: "first step should be choosing question tipe: yes / no, ranking, noul (or whatever the jev types are)"
      reference: jev-polls project chat, Giulio, 2026-10-09, with a screenshot of Step settings
  - id: study-settings-page
    description: >-
      A study page has no tab row: the canvas is the study, and a settings button beside the study
      question opens Study settings as its own page (trail "… / study / Study settings").
    details: Replaced the Pipeline / Study settings tabs so the study follows navigation.breadcrumbs.
    source:
      text: we're switching styles all of a sudden from 1st where Studies is big and not in breadcrumbs to a style where things are in breadcrumbs
      reference: jev-polls project chat, Giulio, 2026-10-09, with a screenshot of the study page tabs
  - id: sample-within-cohort
    description: >-
      A step that asks more distinct people than its cohort's positive-weight personas holds reads
      "Needs more personas", counts toward "Review run · N to fix", and shows "100 of 8 personas"
      on its card; fixing it opens the Cohort tab, which says so in plain words and offers
      "Use all N" and a way to add personas.
    details: >-
      Repeats never add people, so only the sample size is compared. The browser-facing plan error
      for the same rule names the step by number and label instead of its internal ID; CLI errors
      are unchanged.
    source:
      text: Stage 'gamer_interest' sample size 100 exceeds 8 distinct positive-weight profiles
      reference: jev-polls demo walkthrough, red banner after Review run, 2026-10-09
  - id: step-card-anatomy
    description: >-
      Each step card reads top to bottom: number, kind and status; which earlier steps it uses; its
      name and question; who answers (cohort and persona count); what it sends on; and, only on the
      last step of a branch, Add next step.
    details: >-
      Outputs already sent to a later step show only their label with a filled socket; only unused
      outputs say Connect output. Wire labels show only for wires touching the selected step. A
      final result at the end of a branch is the study's answer, not an unfinished connection. The
      canvas toolbar button reads Add step.
    source:
      text: actions and flow still unclear
      reference: jev-polls project chat, Giulio, 2026-10-10, with a screenshot of the 3-step game-name study canvas
  - id: review-run-page
    description: >-
      Review run is one page with no tabs: a summary (steps, request bound, provider and model, the
      model-estimates caveat), the steps in run order, then run settings. Each step reads like its
      flow card: number, name and question, kind, when it starts, who answers, and its request count.
    details: >-
      Questions, inputs, outputs and context sit in one "What this step asks and reads" disclosure
      per step, and a step's question text is not repeated there. Steps and conditions are named by
      step number, matching the flow canvas. Desktop shows up to 8 steps per page, phones 4. The
      header offers Edit study, Set up evaluation provider when needed, and Run study.
    source:
      text: also this ui is shit
      reference: jev-polls project chat, Giulio, 2026-10-10, with a screenshot of the Review run page for the game-name study
