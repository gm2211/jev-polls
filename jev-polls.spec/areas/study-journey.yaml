id: study-journey
name: Main study journey
prose: >-
  The path from a new project to a running study. Each screen leads into the next: create a
  project, land on its studies, open a study's canvas, add rounds on it, give each round a
  cohort (creating one on the spot if needed), then review and run. Requested 2026-10-09 by Giulio
  after "Draft pipeline" sat alone beside the first-study form. The detailed shape below (sidebar,
  railway.com-style canvas, slide-over round panel) is the proposal shown in the "Jev study flow"
  mockups (https://claude.ai/artifact/EEEqHfDTj9tfMt6znpooZr); it is being built in small PRs and
  stays open to revision. "Voting round" in the user's words is the existing Ask cohort step.
behaviors:
  - id: project-lands-on-studies
    description: >-
      Creating a project opens its studies list straight away: the list when studies exist, or an
      empty list that offers to create the first one.
    source:
      text: >-
        I create a project -> right away list of studies or create new if none presetn (look up
        examples online of ux for empty lists and create new by just clicking empty list e.g.)
      reference: jev-polls project thread "Rethink the main user flow", Giulio, 2026-10-09
  - id: empty-list-creates
    description: >-
      An empty studies or cohorts list is itself the create control: clicking anywhere in it
      creates the item and opens it, with no intermediate form.
    details: >-
      A non-empty list keeps a create row at its end and a create button on the title line. A new
      study is named by its question at the top of the study. Draft with assistant is offered on
      the study rather than as a floating page button.
    source:
      text: create new by just clicking empty list
      reference: jev-polls project thread "Rethink the main user flow", Giulio, 2026-10-09
  - id: railway-track
    description: >-
      A study opens as a railway.com-style canvas: rounds are cards on a dotted canvas, wired by
      their outputs, each showing its type, question, a status dot and who answers.
    details: >-
      Rounds are added from a Create control in the canvas corner or by clicking empty canvas,
      and no standing instructions banner sits above the canvas; free placement and drag remain (studies.canvas-drag-nodes, studies.canvas-click-create).
      The user clarified that "railway" means railway.com, so this is a canvas, not a literal
      track.
    source:
      text: >-
        pipeline editor railway-style from which I branch into creating a voting round with types,
        inputs, outputs
      reference: jev-polls project thread "Rethink the main user flow", Giulio, 2026-10-09
  - id: round-panel
    description: >-
      Selecting a round slides a panel over the canvas with one row of tabs (Question, Answers,
      Inputs, Cohort), each marked when it still needs attention; Esc or a close control hides it.
    details: >-
      Modeled on railway.com's service panel. Answers also lists what later rounds can use as
      inputs. Selecting another round, adding one, or connecting an input reopens the panel.
    source:
      text: creating a voting round with types, inputs, outputs and which needs a cohort assigned
      reference: jev-polls project thread "Rethink the main user flow", Giulio, 2026-10-09
  - id: inline-cohort-create
    description: >-
      A round's Cohort tab offers New cohort, built inside the panel; accepting it adds it to the
      shared library, links it to the project, assigns it to the round, and shows the Cohort tab
      again with it selected.
    details: >-
      Back to cohorts returns to the cohort list without changes. With a cohort assigned, the tab
      offers Open full cohort (the detailed editor, with a way back to the study) and Change cohort.
    source:
      text: needs a cohort assigned that I can create right there and then and navigate back to pipeline
      reference: jev-polls project thread "Rethink the main user flow", Giulio, 2026-10-09
  - id: review-run-to-fix
    description: >-
      While steps are unfinished, the study header's primary action reads "Review run · N to fix"
      and opens the first unfinished step's panel on the tab that fixes it; with nothing left it
      opens the run review.
    details: Proposal shown in the "Jev study flow" mockups (step 5); the run review itself is unchanged.
    source:
      text: the user flows aren't flowing at the moment
      reference: jev-polls project thread "Rethink the main user flow", Giulio, 2026-10-09
  - id: project-sidebar
    description: >-
      Inside a project, a sidebar holds the way back to all projects, the project name, Studies
      (with each study nested beneath it), Cohorts, Runs and Settings, each section with its count.
    details: >-
      The open section or study is marked current. On narrow screens the sidebar becomes a single
      scrollable row above the page and nested studies are hidden.
    source:
      text: >-
        also consider something like this as a possible layout inspiration (it's still not
        perfect, but navigation tabs here are in a sidebar)
      reference: >-
        jev-polls project chat, Giulio, 2026-10-09, with screenshots of the TypeSafe AI console;
        follows "while I generally love tabbed uis, the way this is structured is confusing"
  - id: inline-edit-single-save
    description: >-
      Inline edits of a study question or project name have no check or cancel buttons: Enter
      saves the change, Esc or clicking away discards it, and a short hint says so.
    details: >-
      Keeps the page's Save as the only save button beside the field. Esc in the field does not
      close the step panel. Giulio corrected an earlier version that kept the edit on click-away:
      "clicking outside is implied X discard" (2026-10-09).
    source:
      text: this looks super weird - double save
      reference: >-
        jev-polls project chat, Giulio, 2026-10-09, with screenshots of the study question field
        showing check and cancel icons beside Save
  - id: step-settings-no-repeat
    description: >-
      Step settings never repeat the study question: the page heading and last crumb both read
      "Step N settings".
    details: >-
      First shipped as a "Step N settings" label beside a Back to flow button; replaced the same day
      by breadcrumb levels (navigation.breadcrumbs).
    source:
      text: weird repetition
      reference: >-
        jev-polls project chat, Giulio, 2026-10-09, with a screenshot of the study title repeated
        in "Step settings · 1. <same question>"
  - id: answer-kind-first
    description: >-
      Editing an Ask cohort step starts with "What kind of answer?": Yes / no, Compare options or
      Ordered scale, each with a one-line explanation, before the question text, name or personas.
    details: >-
      Shown first on the step panel's Question tab and in Step settings. The app has no separate
      ranking type; Compare options ranks the options by preference, and its hint says so.
    source:
      text: "first step should be choosing question tipe: yes / no, ranking, noul (or whatever the jev types are)"
      reference: jev-polls project chat, Giulio, 2026-10-09, with a screenshot of Step settings
