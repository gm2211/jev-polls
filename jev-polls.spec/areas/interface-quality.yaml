id: interface-quality
name: Interface quality
prose: >-
  The workspace is a working research instrument: clear readouts, aligned records, visible
  controls, one focused task surface (docs/design-direction.md).
behaviors:
  - id: focused-tabs-pagination
    description: Views prefer focused tabs and pagination over long pages or stacked editors.
    source:
      text: Prefer focused tabs and pagination over long pages or stacked editors.
      reference: AGENTS.md
  - id: pagination-in-flow
    description: >-
      A list's pager sits in the document flow after its rows and never floats over them; page
      sizes fill a desktop viewport (personas show 12 per page on desktop, 6 on phone widths).
    source:
      text: "fix everything (from the UI audit: the sticky pager covered the Review run step cards on phone and clipped the third persona row)"
      reference: jev-polls project thread "UI audit in headless browser", Giulio, 2026-10-10
  - id: no-controls-in-disclosures
    description: Buttons and editable controls never sit inside collapsible disclosures.
    source:
      text: Keep buttons and editable controls outside collapsible disclosures.
      reference: AGENTS.md
  - id: reachable-actions
    description: Navigation, save actions, and page controls stay easy to reach.
  - id: responsive-no-clipping
    description: >-
      Every view works at 375, 768, 1024, and 1440px and under zoom with natural overflow and no
      clipped controls.
  - id: target-size
    description: Interactive targets are at least 44px and keyboard focus is visible.
  - id: theme-and-accent
    description: >-
      Primary actions use orange and successful progress uses steel blue; light and dark modes stay
      readable, and the initial theme follows the OS preference.
    details: >-
      With no saved choice the workspace reads prefers-color-scheme at boot and again when the
      saved choice is cleared; the toggle shows its text label on phone widths too. Fixed on
      2026-10-10 from the UI audit (the app always opened light).
  - id: delete-dialogs-one-sentence
    description: >-
      Every delete confirmation (project, study, cohort) uses the same shape: one sentence of
      impact, a Cancel button and a Delete <thing> button.
    details: >-
      Replaced "Delete from draft" and the three-line Data / Reload saved workspace copy on
      2026-10-10 from the UI audit.
    source:
      text: fix everything (audit item 17, delete dialogs)
      reference: jev-polls project thread "UI audit in headless browser", Giulio, 2026-10-10
  - id: status-probes-return-200
    description: >-
      Status probes the page runs on load (such as the ChatGPT sign-in status) answer 200 with a
      state, including unavailable, so a missing keychain never logs an error in the console.
  - id: errors-in-context
    description: Errors appear in the dialog or field that raised them.
  - id: destructive-actions-recoverable
    description: Removing steps, personas, segments, sources, questions, or inputs, or replacing options, can be undone or is confirmed.
  - id: no-dead-ui
    description: Every view and control in the workspace is reachable.
  - id: draft-panel-no-overlap
    description: The drafting panel and the step panel never show together; opening one closes the other.
  - id: single-click-opens-panel
    description: A single click on a control opens it even while an inline title or name editor is focused.
  - id: dialogs-close-on-escape
    description: Esc closes the AI settings dialog like its close button.
  - id: errors-clear-on-success
    description: >-
      The error banner clears when a later save or review succeeds and on any click, can be
      dismissed by clicking it, and sticks near the top instead of pushing content down for good.
    source:
      text: The red error banner stayed visible after the next save and Review run succeeded.
      reference: jev-polls project thread, 2026-10-10

  - id: one-list-row
    description: >-
      Projects, Studies and Cohorts lists use the same row: title, an optional one-line subtitle,
      small counts, a chevron, and trailing icon actions (rename, delete); each list has one create
      button, on the title line, labeled New project, New study or New cohort.
    details: >-
      Before 2026-10-10 the three lists had three designs: project cards with counts and a chevron,
      study rows with a chevron, and cohort cards with a large persona count, no chevron, a dashed
      New cohort card at the end and a header button that said Generate cohort. The shared row is
      listRow in the workspace client.
    source:
      text: Three sibling list pages, three card designs (UI audit, item 8)
  - id: save-is-the-only-commit
    description: >-
      Editing forms have no per-form Apply button; the page header's Save is the one commit control,
      and fields are read into the draft when the user saves or leaves the editor.
    details: >-
      Removed on 2026-10-10: Apply weights, Apply details, Apply source, Apply cohort details, Apply
      brief, Apply persona edits, Apply weight, and the unlabeled check-mark button on Project
      settings. Typing in any editing form marks the draft unsaved at once, so the "Unsaved
      changes" status and the Save button reflect the edit before it is committed. Sub-editors that
      build a draft object before adding it to a list (distribution targets, proposed options) keep
      their own confirm button. A section tab row appears only when there are two or more sections.
    source:
      text: Apply, then Save, then it says "All changes saved" anyway (UI audit, item 7)
  - id: one-vocabulary
    description: >-
      The workspace and the report use one set of nouns: project, study, step, cohort, persona,
      run, report. A step is never a stage, phase, panel or round in user-facing text, a study is
      never a pipeline, and the live run page is not an arena.
    details: >-
      Swept on 2026-10-10 (UI audit item 6): "What should this pipeline do?" and "Build with words"
      became "What should this study do?" and "Draft with assistant"; "Cohort host map" became
      "Who answers"; "THE COHORT ARENA" became "LIVE RUN"; "Pipeline stages", "Entry stage",
      "poll phase" and "Arena pages" became "Study steps", "First step", "Ask cohort step" and
      "Result pages"; the report's "Panel route", "Stage report", "field notes" and "research run"
      became "Steps", "Step report" and "study report"; the empty-studies copy no longer says
      "rounds on its track". The placeholder question text for a new step reads "What should this
      step decide?", and the old "phase" wording is still recognized as a placeholder in saved
      files. Identifiers, file formats and the CLI keep their names.
    source:
      text: Five words for the same thing (UI audit, item 6)
      reference: jev-polls project thread "UI audit in a headless browser", 2026-10-10
