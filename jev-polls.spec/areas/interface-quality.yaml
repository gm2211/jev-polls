id: interface-quality
name: Interface quality
prose: >-
  The workspace is a working research instrument: clear readouts, aligned records, visible
  controls, one focused task surface (docs/design-direction.md).
behaviors:
  - id: focused-tabs-pagination
    description: Views prefer focused tabs and pagination over long pages or stacked editors.
    source:
      text: Prefer focused tabs and pagination over long pages or stacked editors.
      reference: AGENTS.md
  - id: pagination-in-flow
    description: >-
      A list's pager sits in the document flow after its rows and never floats over them; page
      sizes fill a desktop viewport (personas show 12 per page on desktop, 6 on phone widths).
    source:
      text: "fix everything (from the UI audit: the sticky pager covered the Review run step cards on phone and clipped the third persona row)"
      reference: jev-polls project thread "UI audit in headless browser", Giulio, 2026-10-10
  - id: no-controls-in-disclosures
    description: Buttons and editable controls never sit inside collapsible disclosures.
    source:
      text: Keep buttons and editable controls outside collapsible disclosures.
      reference: AGENTS.md
  - id: one-type-scale
    description: >-
      Headings, buttons, tabs, inputs and labels use one family (IBM Plex Sans) and one six-step
      size scale (11, 12, 14, 17, 22, 30px) with weights 400, 500 and 600; Space Grotesk is kept
      for the jev wordmark only.
    source:
      text: getting better but fonts are inconsistent across ui elements, also too many buttons it should be intuitive
      reference: 2026-10-11 jev-polls project chat, Giulio, on the empty study page
  - id: one-next-action
    description: >-
      Each action appears once, where a first-time user looks for it, so there is always one
      obvious next step. An empty study offers only the canvas's two ways in (add a question,
      describe it in words); Save shows only while something is unsaved, and Cmd/Ctrl+S saves.
    source:
      text: specifically what I like is that together with "ask question" or "describe in words" it provides clear next step
      reference: 2026-10-11 jev-polls project chat, Giulio
  - id: exclusive-input-choices
    description: >-
      When a value can be entered several ways, the ways are mutually exclusive cards picked
      first (Type a list, Import a file, Draft with AI) and only the chosen input shows. Once
      options exist they appear once, in the one editable list.
    source:
      text: this is messy, ther should be clear mutually exclusive import or list options
      reference: 2026-10-11 jev-polls project chat, Giulio, on the step panel's Options tab
  - id: step-panel-one-level
    description: >-
      The step panel is one level deep. Creating an audience in Who answers is one column: the
      form, then progress in its place, then the draft to review, with no sub-tabs, back button
      or cards inside the panel.
    source:
      text: lots of nesting - what can we do to make things flow more naturally
      reference: 2026-10-11 jev-polls project chat, Giulio, on Who answers during generation
  - id: progress-fits-panel
    description: >-
      Generation progress is one readout (title, count, estimate, bar, one plain status line and one muted detail line) that fits
      its panel without scrolling, with no detail tabs.
    source:
      text: this ui should not be scrollable
      reference: 2026-10-11 jev-polls project chat, Giulio, on cohort generation progress
  - id: progress-steady
    description: >-
      While a generation runs, status polls update the readout's numbers and text in place; the
      page and the step panel are not redrawn, nothing slides or fades, and the readout keeps the
      same height. Its text uses the app's normal type and contrast, with no link-coloured, bold or
      explainer lines.
    details: >-
      Before, each one-second poll re-rendered the whole page, replaying the step panel's slide-in
      animation (21 replays in 21 s in a browser check); after, none. The panel animates only when it
      first opens.
    source:
      text: it flashes almost like a glitch and still very unclear progress report
      reference: 2026-10-11 jev-polls project thread, Giulio, with a screenshot of the Who answers progress; followed by "very thin and messy text"
  - id: reachable-actions
    description: Navigation, save actions, and page controls stay easy to reach.
  - id: responsive-no-clipping
    description: >-
      Every view works at 375, 768, 1024, and 1440px and under zoom with natural overflow and no
      clipped controls.
  - id: target-size
    description: Interactive targets are at least 44px and keyboard focus is visible.
  - id: theme-and-accent
    description: >-
      Primary actions use orange and successful progress uses steel blue; light and dark modes stay
      readable, and the initial theme follows the OS preference.
    details: >-
      With no saved choice the workspace reads prefers-color-scheme at boot and again when the
      saved choice is cleared; the toggle shows its text label on phone widths too. Fixed on
      2026-10-10 from the UI audit (the app always opened light).
  - id: delete-dialogs-one-sentence
    description: >-
      Every delete confirmation (project, study, cohort) uses the same shape: one sentence of
      impact, a Cancel button and a Delete <thing> button.
    details: >-
      Replaced "Delete from draft" and the three-line Data / Reload saved workspace copy on
      2026-10-10 from the UI audit.
    source:
      text: fix everything (audit item 17, delete dialogs)
      reference: jev-polls project thread "UI audit in headless browser", Giulio, 2026-10-10
  - id: status-probes-return-200
    description: >-
      Status probes the page runs on load (such as the ChatGPT sign-in status) answer 200 with a
      state, including unavailable, so a missing keychain never logs an error in the console.
  - id: errors-in-context
    description: Errors appear in the dialog or field that raised them.
  - id: destructive-actions-recoverable
    description: Removing steps, personas, segments, sources, questions, or inputs, or replacing options, can be undone or is confirmed.
  - id: no-dead-ui
    description: Every view and control in the workspace is reachable.
  - id: draft-panel-no-overlap
    description: The drafting panel and the step panel never show together; opening one closes the other.
  - id: single-click-opens-panel
    description: A single click on a control opens it even while an inline title or name editor is focused.
  - id: dialogs-close-on-escape
    description: Esc closes the AI settings dialog like its close button.
  - id: errors-clear-on-success
    description: >-
      The error banner clears when a later save or review succeeds and on any click, can be
      dismissed by clicking it, and sticks near the top instead of pushing content down for good.
    source:
      text: The red error banner stayed visible after the next save and Review run succeeded.
      reference: jev-polls project thread, 2026-10-10

  - id: one-list-row
    description: >-
      Projects, Studies and Cohorts lists use the same row: title, an optional one-line subtitle,
      small counts, a chevron, and trailing icon actions (rename, delete); each list has one create
      control, a dashed New project, New study or New cohort tile after the list that is also the
      empty state (projects.new-project-tile).
    details: >-
      Before 2026-10-10 the three lists had three designs: project cards with counts and a chevron,
      study rows with a chevron, and cohort cards with a large persona count, no chevron, a dashed
      New cohort card at the end and a header button that said Generate cohort. The shared row is
      listRow in the workspace client. On 2026-10-11 the title-line New study and New cohort
      buttons gave way to the same tile Projects uses.
    source:
      text: Three sibling list pages, three card designs (UI audit, item 8)
  - id: no-redundant-controls
    description: >-
      A page shows no control that duplicates something the app already does on its own: the Runs
      list has no Refresh button because the workspace re-reads saved state every 5 seconds while
      visible, and the New cohort page states its one-line purpose under the title instead of in
      an "About this cohort" disclosure for a cohort that does not exist yet.
    source:
      text: save button for projects makes no sense - scan for other weird things like this
      reference: 2026-10-11 jev-polls project chat, Giulio
  - id: save-is-the-only-commit
    description: >-
      Editing forms have no per-form Apply button; the page header's Save is the one commit control,
      and fields are read into the draft when the user saves or leaves the editor.
    details: >-
      Removed on 2026-10-10: Apply weights, Apply details, Apply source, Apply cohort details, Apply
      brief, Apply persona edits, Apply weight, and the unlabeled check-mark button on Project
      settings. Typing in any editing form marks the draft unsaved at once, so the "Unsaved
      changes" status and the Save button reflect the edit before it is committed. Sub-editors that
      build a draft object before adding it to a list (distribution targets, proposed options) keep
      their own confirm button. A section tab row appears only when there are two or more sections.
    source:
      text: Apply, then Save, then it says "All changes saved" anyway (UI audit, item 7)
  - id: one-vocabulary
    description: >-
      The workspace and the report use one set of nouns: project, study, step, cohort, persona,
      run, report. A step is never a stage, phase, panel or round in user-facing text, a study is
      never a pipeline, and the live run page is not an arena.
    details: >-
      Swept on 2026-10-10 (UI audit item 6): "What should this pipeline do?" and "Build with words"
      became "What should this study do?" and "Draft with assistant"; "Cohort host map" became
      "Who answers"; "THE COHORT ARENA" became "LIVE RUN"; "Pipeline stages", "Entry stage",
      "poll phase" and "Arena pages" became "Study steps", "First step", "Ask cohort step" and
      "Result pages"; the report's "Panel route", "Stage report", "field notes" and "research run"
      became "Steps", "Step report" and "study report"; the empty-studies copy no longer says
      "rounds on its track". The placeholder question text for a new step reads "What should this
      step decide?", and the old "phase" wording is still recognized as a placeholder in saved
      files. Identifiers, file formats and the CLI keep their names.
    source:
      text: Five words for the same thing (UI audit, item 6)
      reference: jev-polls project thread "UI audit in a headless browser", 2026-10-10
  - id: step-panel-one-type-scale
    description: >-
      Every tab of the step panel uses the same sizes: field labels and help text at the small
      size, inputs, selects and text areas at the body size, and section headings at the body size.
      No tab shrinks its own labels or inputs.
    details: >-
      Before 2026-10-11 a desktop density block made "What do you want to ask?" 11px while "Who are
      they?" was 12px, the question text area 12px while the AI select was 14px, and help text 11px.
    source:
      text: fonts are inconsistent across ui elements, also too many buttons it should be intuitive
      reference: jev-polls project chat, Giulio, 2026-10-11
  - id: step-panel-one-next
    description: >-
      While the step panel shows a guided stop (What to ask, Options, Who answers), its footer is the
      only Next button; the study header drops its own Next until the panel closes or shows Settings
      or Inputs. The Options tab shows the options and the honest output note only, without a second
      heading or a "Later steps can use" list. Refresh connections appears only when the chosen
      drafting AI is not ready. The Settings tab has no second "Step settings" heading.
    source:
      text: too many buttons it should be intuitive
      reference: jev-polls project chat, Giulio, 2026-10-11
  - id: actions-are-icon-buttons
    description: >-
      Workspace actions render as small buttons with an icon, never as underlined text links. On the
      Options tab, Import and Draft with AI are two small icon buttons; the review panel's run details,
      the cohort form's "Choose a saved audience instead" and a run's Open study use the same small
      button. Breadcrumbs and links inside running text stay links.
    details: >-
      Before 2026-10-11 these four actions were underlined text (link-button), including a single
      "Import or draft with AI" link above the options list.
    source:
      text: no html plain links please - small buttons instead, ideally with icons
      reference: jev-polls project thread, Giulio, 2026-10-11
  - id: options-no-placeholder-rows
    description: >-
      An empty options list shows only the add row and "No options yet"; blank placeholder rows
      ("Option 1", "Option 2") are not drawn, and blank rows never block review once two options
      are named.
    details: >-
      Before 2026-10-12 a new Compare options step showed two empty "Option 1 / Option 2" rows with
      delete icons above "No options yet".
    source:
      text: why 2 option placeholders
      reference: jev-polls project chat, Giulio, 2026-10-12
  - id: readable-attribute-values
    description: >-
      Persona attributes read as text, never raw JSON: a list of records is a compact table with
      plain-word column headers, a single record is label/value rows, and keys are plain words
      ("Top10Games" reads "Top 10 games", "costUsd" reads "Cost (USD)" with $5 or Free).
    details: >-
      Applies wherever attributes are shown read-only: the report's persona details, the live and
      replay detail panel, the cohort and audience seat maps, and the persona replacement
      comparison. The persona editor keeps its editable JSON field. Before 2026-10-12 the report
      drew each record as a JSON string inside a pill chip.
    source:
      text: we can do better than raw json in report
      reference: jev-polls project thread, Giulio, 2026-10-12
  - id: chrome-not-selectable
    description: >-
      Workspace chrome (buttons, labels, tabs, menus, list rows, headings, hints, dialog text and
      the command palette) cannot be text-selected; produced content stays selectable.
    details: >-
      Selectable content: typed fields, persona profiles, stories and sources, live and replay
      answers, Jev's drafted proposals and command replies, code to copy, and error text. The
      workspace is unselectable at the page level and that content opts back in, so new chrome is
      covered without per-element rules. The standalone report stays selectable throughout.
    source:
      text: most ui elements that are not produced text should not be selectable
      reference: jev-polls project thread, Giulio, 2026-10-12
  - id: modal-click-outside-closes
    description: >-
      Clicking outside any modal (every dialog and the command palette) closes it through its own
      close or Cancel action; a press that starts inside the modal and ends outside does not.
    details: >-
      Confirmation dialogs (delete, reload saved) treat it as Cancel. Import workspace, Connect
      TypeSafe and Paste a list stay open while they hold typed text or a loaded file and say how to
      discard it; the command palette stays open while an AI request runs.
    source:
      text: clicking out of a modal should close it
      reference: jev-polls project thread, Giulio, 2026-10-12
