id: studies
name: Study flow
prose: >-
  A study is an acyclic flow of steps. The workspace opens it on a canvas; the selected step's
  Question, Answers, Inputs, Cohort, and Settings are tabs in a panel over the canvas
  (study-journey.round-panel). Named inputs pass typed outputs from earlier steps.
behaviors:
  - id: create-study
    description: >-
      New study creates a study at once and opens it as an empty canvas with the study question
      field focused; the first question is added on the canvas and starts from the study question
      (study-journey.empty-canvas-entry-points).
    details: >-
      A project can hold several studies (projects.multiple-studies); new studies are named
      "Study N" until their question is set. Changed 2026-10-09 from a question-first form, per
      study-journey.empty-list-creates.
  - id: study-named-by-question
    description: >-
      A study is identified by its research question everywhere it is listed or referred to:
      studies list, sidebar, breadcrumbs, page title, run cards, run detail, search results and the
      report headline; the study name is secondary, shown as the report subtitle and used for
      exported files and the CLI.
    details: >-
      Before 2026-10-10 the Runs page, run breadcrumb, search palette and report used the study
      name while every other surface used the question, so one study read as two. A run card's
      title links back to its study, the run id is a tooltip on the date rather than a heading,
      and the two static explainer cards on the Runs page were folded into one sentence under the
      list. In study settings the question is a multi-line field, placed before the name. A study
      with an empty question falls back to its name.
    source:
      text: One study, two names (UI audit, item 1) and Runs page shows a UUID and two permanent explainer cards (item 11)
      reference: jev-polls project thread "UI audit in a headless browser", 2026-10-10
  - id: one-new-study-button
    description: >-
      A project's study list offers a single New study button, in the page header; the empty list
      keeps its own create prompt.
    source:
      text: Studies page shows two New study buttons when a study exists.
      reference: jev-polls demo recording, 2026-10-10
  - id: count-labels-singular
    description: >-
      Count labels on the canvas and cohort views use the singular for one (1 persona, 1 member,
      1 step), never "1 personas".
    source:
      text: step cards on the canvas say 1 personas and Explore 1 members.
      reference: jev-polls demo recording, 2026-10-10
  - id: delete-study
    description: >-
      Each row in a project's studies list has a delete button that asks for confirmation before
      removing that study; the project's cohorts and saved run reports stay.
    details: >-
      Blocked while the study's run is active. Like other list deletions, confirming saves at once
      (projects.list-pages-no-save).
    source:
      text: should have quick delete (with confirmation)
      reference: jev-polls project chat, Giulio, 2026-10-09, with a screenshot of the Studies list
  - id: step-kinds
    description: >-
      Steps are Ask cohort (one or more questions to a sampled cohort), Combine answers (weighted
      compatible inputs), or Final result (a declared selection from a Choice source).
  - id: question-types
    description: >-
      Questions are Choice (2–255 options), Score (2–10 ordered levels), or Yes/No.
  - id: connect-outputs
    description: >-
      Connect output then Connect here adds a named input to the target step and makes the source
      a dependency; cycles and incompatible projections are refused with the reason.
  - id: input-projections
    description: >-
      An input selects a source output's summary, winner (Choice), mean (Score, Yes/No),
      probabilities (Choice, Score), or weighted responses.
  - id: named-inputs-visible
    description: >-
      Users can see and rename each input name in the default editor and reference it as
      inputs.<name> in question text.
  - id: branches-and-joins
    description: >-
      Steps support join all or any and conditions built from all, any, not, and comparisons on a
      direct dependency's winner, margin, top probability, or mean.
    details: >-
      Winner, margin, and top probability apply to Choice only. Schema, engine, and docs follow the
      same rule.
  - id: optional-inputs-null
    description: An input from a skipped optional branch is passed as null.
  - id: sample-size-bounds
    description: >-
      Sample size lies between the number of positive-weight segments and the number of eligible
      personas; repeats lie between 1 and 100.
  - id: multiple-cohorts
    description: Different steps can consult different cohorts.
  - id: structured-context
    description: Step and shared context can be edited without writing raw JSON.
  - id: settings-in-plain-words
    description: >-
      Study settings use the researcher's words: the research question is a multi-line field,
      the JSON block is labeled Background facts with a sentence saying what it is for, and
      cohort aliases read as "Cohorts this study can ask" with Short name and Cohort columns.
    details: Renamed from "Shared context · JSON" and "Cohort alias → cohort" on 2026-10-10 from the UI audit (item 16).
  - id: canvas-drag-nodes
    description: >-
      Steps can be dragged anywhere on the study canvas; connections follow the moved step, and the
      position is saved with the study so it survives reload.
    details: >-
      A press that moves less than a few pixels is still a click (select, connect, add). Steps
      without a saved position keep the automatic left-to-right layout by dependency depth. Dragging
      empty canvas pans the view. Positions are layout only and never change the study's logic.
    source:
      text: should be able to drag around.
      reference: jev-polls project thread, 2026-10-09
  - id: canvas-click-create
    description: >-
      Clicking empty canvas opens a filterable menu of step kinds (Ask cohort, Combine answers,
      Final result) at the pointer; choosing one creates that step at the clicked spot and selects it.
    details: >-
      Modeled on Railway and Hex canvases. The menu is keyboard operable (type to filter, arrows,
      Enter, Escape) and closes on outside click. New steps start unconnected.
    source:
      text: should be able to click on canvas to create node with dropdown - look at railway.com or hex.com for inspiration
      reference: jev-polls project thread, 2026-10-09
  - id: canvas-click-closes-panel
    description: >-
      While a step's side panel is open, clicking empty canvas closes the panel instead of opening
      the add-step menu; with the panel closed, clicking empty canvas opens the menu as before.
    details: >-
      Only that click is consumed. Clicking a step card still selects that step, and dragging still
      moves steps or pans the canvas. The Before you run panel closes the same way. The add-step
      menu never opens beneath a panel: opening it from Add step, Enter, or a wire dropped on canvas
      closes the panel first.
    source:
      text: when sidepane is open, clicking outside of it closes it (currently it opens the canvas menu if i click on canvas)
      reference: jev-polls project thread, 2026-10-12
  - id: canvas-drag-connect
    description: >-
      Dragging from a step's output socket draws a live wire that follows the pointer; dropping it on
      a step that can use that output connects them. Works with mouse, pen and touch.
    details: >-
      While dragging, steps that can accept the output are outlined and others fade; the step under
      the pointer is highlighted and the wire snaps to it. Dropping anywhere else cancels with no
      change. The canvas scrolls when the pointer nears its edge. A press that barely moves is still
      a click, so the existing click-then-Connect-here flow keeps working. A drop selects the target
      step without opening the step panel, so several wires can be drawn in a row; if the panel is
      already open it switches to the target's Inputs tab.
    source:
      text: I should be able to drag connect from "connect output"
      reference: jev-polls project thread, 2026-10-11
  - id: canvas-drop-to-create
    description: >-
      Dropping a dragged output on blank canvas opens the add-step menu at the drop point; the step
      picked is created there already reading that output.
    details: >-
      A dashed wire runs from the output to the menu while it is open. The menu offers only step kinds
      that can use the output (Final result needs a Choice). Esc or an outside click closes it with no
      change. Dropping on a step that can't use the output, or on the step panel, still cancels.
    source:
      text: connecting output to blank canvas should trigger popup for new node creation
      reference: jev-polls project chat, 2026-10-12
  - id: canvas-uniform-cards
    description: >-
      Step cards of the same kind are the same height on the canvas whether or not they are named,
      connected or selected.
    details: >-
      The title is one line with one line under it (the question when the step is named, otherwise
      the kind of answer, such as Compare 3 options). What a step reads is a small chip of step
      numbers in the card header instead of its own row. The output row always has two lines:
      Connect output, or where it is sent (Sent to step 2, Final answer), above what it carries.
      Add next step shows on every Ask and Combine card. Selection is drawn with a ring, not a
      thicker border. Full title and question show on hover.
    source:
      text: why is 2 taller than 1?
      reference: jev-polls project chat, 2026-10-12
  - id: edge-labels-on-hover
    description: >-
      A wire is named only while the pointer is on it, or while keyboard focus is on its step's
      inputs chip (the step numbers it reads, in its header): a small tooltip says what it carries (Answer summary, Individual answers,
      Leading option, Mean score or the distribution) and between which steps. No label is drawn on
      wires otherwise, and a selected step's wires are only highlighted.
    details: >-
      The tooltip is clamped to the visible canvas and never sits under the slide-over; Esc dismisses
      it. Wires that run under the slide-over are clipped by the canvas scroll box, not drawn over the
      panel. The full list of what a step reads is on its card (the inputs chip names every
      connection to assistive tech) and in the panel's Inputs tab. Replaces always-on labels on every
      wire touching the selected step, which landed on top of cards and were cut by the slide-over.
    source:
      text: "Edge labels bleed under the side panel (UI audit item handed to the canvas work: label only the hovered or focused wire)"
      reference: jev-polls project thread "UI audit in a headless browser", Giulio, 2026-10-10
  - id: phone-flow-list
    description: >-
      At 700px and narrower the study flow is a vertical list of full-width step cards in run order,
      with "Reads step N" lines (naming what is read) in place of wires; Add step, Add next step and
      Connect output / Connect here work as on the canvas, and the step panel fills the screen.
    details: >-
      Wider screens keep the graph canvas. Run order puts each step after everything it reads and
      otherwise follows step numbers, so a newly added unconnected step lands last. Dragging,
      panning, fit and zoom are off in list mode, and adding a step there saves no canvas position,
      so the wide layout is untouched. A pending connection's hint sticks to the top of the list.
      Crossing 700px re-renders between list and canvas without losing the selection or unsaved
      fields.
    source:
      text: "Phone canvas unreadable at 390px: fit-to-view shrinks cards to thumbnails (UI audit item handed to the canvas work)"
      reference: jev-polls project thread "UI audit in a headless browser", Giulio, 2026-10-10
  - id: prune-dangling-aliases
    description: >-
      Choosing a cohort for a step removes study cohort aliases that no step uses and that point to
      a missing cohort (aliases of existing cohorts stay). Review and save do the same with a
      notice naming the study and alias, and a step that still uses a missing cohort is reported
      in plain words naming the study, step and alias. CLI and MCP errors are unchanged.
    source:
      text: Pipeline references missing cohort id; the user had to click x on "audience → Choose a cohort" in Study settings.
      reference: jev-polls project thread, 2026-10-10

  - id: options-from-previous-step
    description: >-
      A Compare options step can take its options from an earlier step's option comparison instead
      of a typed, imported or drafted list: "From a previous step" is the fourth way to add options.
      The user picks the source step and keeps either the top N options (2–255, default 4 when the
      source has more than 4) or all of them. When the study runs, the source's options are ranked
      by share of its answers (ties keep the source's order) and the top N become this step's
      options, with the source's names and descriptions. The step depends on the source, so the
      canvas draws the connection and the Inputs tab lists it as "Supplies this step's options",
      but the source's answers are not passed along as context. The list on the Options tab is
      read-only and follows the source's edits; switching back to another way restores the typed
      list and drops the dependency unless something else needs it.
    details: >-
      Stored as optionsFrom { stage, question, top? } on the choice question; criteria keeps a copy
      of the source's options for the editor. Requests carry only the kept options and no
      optionsFrom, so evaluation caching keys on the options actually asked. A source without a
      completed result fails the step rather than guessing. Saved runs validate against the options
      the step actually asked.
    source:
      text: the options section should give me the "option" (no pun intended) of using the outputs of a previous stage as outputs
      reference: jev-polls project thread, Giulio, 2026-10-12

  - id: delete-any-step
    description: >-
      Every kind of step (Ask the audience, Combine answers, Final answer) can be deleted from its
      step panel header and from its card on the canvas, or with Delete or Backspace on a focused
      card. One dialog confirms it and names the later steps that read from it. Those steps stay and
      lose only the connections, run-order links, branch rules and option sources that pointed at
      the deleted step; options taken from it stay as typed options. The toast's Undo or Ctrl/⌘+Z
      restores the step with its connections and canvas position, unless the study changed since.
    details: >-
      The canvas card shows its delete button on hover or keyboard focus to keep narrow cards
      readable; phone lists and touch screens show it on every card or the selected one. Undo keeps
      up to 20 deletions and refuses rather than overwrite a later edit. Typing in a field never
      deletes a step.
    source:
      text: "1. every node type should have a way to delete it from subpane / 2. I should be able to delete nodes quickly from canvas (with confirmation and undo)"
      reference: jev-polls project thread "delete from side pane", Giulio, 2026-10-12

  - id: final-answer-reads-switchboard
    description: >-
      A Final answer's Options and Reads tabs do not overlap. Options holds what Jev can pick from
      (typed options or the top options of an earlier step). Reads holds only the evidence Jev
      weighs: every earlier output once, grouped by step, each with an Off / Summary / Every answer
      switch. Turning a row on connects that output; Off disconnects it. The same earlier step can
      supply both the options and evidence.
    details: >-
      Chosen as design A of five mocked alternatives, then narrowed so the options source shows
      only on the Options tab. Turning off the options source's evidence keeps it as a run
      dependency. Large reads are still split into slices automatically.
    source:
      text: "Unclear difference between Options and Reads - should they not be mutually exclusive?"
      reference: jev-polls project thread "Reads tab", Giulio, 2026-10-12 (asked for alternatives with "this is a little messy and confusing give me 5 alternative designs")
