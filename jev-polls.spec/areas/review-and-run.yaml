id: review-and-run
name: Review and run
prose: >-
  Inference happens only after an explicit review of an exact saved revision with a request
  budget. A running study can be cancelled; partial results are kept and labeled. Decided
  2026-10-10 (docs/ux-review H3).
behaviors:
  - id: no-implicit-inference
    description: >-
      Opening the workspace, connecting an account, saving, drafting, searching, and navigating
      never start a study.
  - id: request-plan
    description: >-
      Review run validates and saves, then shows each step's request count, the total upper bound
      (sum of size × repeats), provider and model, and evidence warnings.
  - id: plan-busy-state
    description: A visible busy state shows while the plan is prepared, and repeated clicks have no effect.
  - id: run-gate
    description: >-
      Run study requires the exact reviewed revision, a single-use plan token that expires after
      15 minutes, and a request limit no lower than the plan bound.
  - id: budget-minimum-visible
    description: The request limit field shows the plan's minimum and blocks lower values before submission.
  - id: stale-plan-explained
    description: >-
      When the saved revision changes or the plan expires, the review page says the plan is out of
      date and offers Review again.
  - id: provider-required
    description: Without a ready evaluation provider, Run study is disabled and Set up evaluation provider is offered.
  - id: no-mock-fallback
    description: Normal runs use the selected live provider with no silent mock fallback; mock runs never enter workspace history.
  - id: cancel-run
    description: >-
      Cancel run stops new evaluations, lets in-flight ones finish, and saves the run as
      cancelled with its partial results.
    source:
      text: 1b 2a
      reference: >-
        2026-10-10 jev-polls project thread, Giulio, choosing option A for run cancellation: cancel and keep partial results
  - id: cancelled-run-results
    description: >-
      A cancelled run's report and live view label results as partial, and re-running the same
      study reuses cached answers so unchanged requests are not spent again.
    details: >-
      Example: a 66-request plan cancelled after 10 requests costs 56 new requests on an unchanged
      re-run; only requests whose question changed are re-evaluated.
    source:
      text: 1b 2a
      reference: >-
        2026-10-10 jev-polls project thread, Giulio, choosing option A for run cancellation: cancel and keep partial results
  - id: one-run-at-a-time
    description: Only one workspace run is active at a time, and starting another reports that a run is in progress.
  - id: jev-request-budget
    description: >-
      Review estimates each step's largest Jev request (persona details plus the longest question,
      limit 32k tokens; plus all questions, limit 64k) and blocks a step over a limit, naming the
      step, estimated size, limit and largest contributor; steps above 80% only warn. Each step
      shows its largest request.
    source:
      text: >-
        we're gonna have one Jev for each persona so we need to make sure that the collective size of the question with all the options and the backstory for the persona, any detail and context about the persona, those things have to be within the limits for Jev otherwise it's just not gonna work.
      reference: 2026-10-09 jev-polls project thread, Giulio
  - id: batched-input-review
    description: >-
      A step with a batched input shows how it reads, e.g. "Reads 1,000 responses in 10 batches of
      100, then combines them in 1 round", with its largest Jev request. Request counts include
      every layer, and a step blocked by an unbatched responses input offers Split into batches on
      its Inputs tab, which Review opens when it reports the step.
    source:
      text: >-
        we might end up having to figure out some sort of like map reduce at some point if we if the size of our inputs is too big uh between steps where we cannot pass the outputs of what the previous step into the later step um we might have to basically kind of like actually create like a clone of all the steps into like a clone the steps of the second step. So for example if it was like board member eight board eight board members reviewing you know the outputs of like a thousand like cohorts, maybe it will have to be something like uh eight board board members review the first batch of like a hundred, another eight board members review like the batch of another a hundred, and so on and so forth in parallel and then you know eight board members and you ideally like then we can fit like the output of like those steps into like a single like thing but we w we'll have you know enough layers until it all fits in the input tokens.
      reference: 2026-10-09 jev-polls project thread, Giulio
  - id: default-run-concurrency
    description: >-
      Run settings default to 12 requests in flight (engine cap 16, TypeSafe rate limit 80 per
      second), so a 1,000-person step finishes in about two minutes and Live voting fills visibly
      from the first seconds.
    source:
      text: >-
        you must be able to produce a 1 minute demo that shows very simple, streamlined, almost guided process, without needing to jump between screeens and with a compelling live voting view
      reference: 2026-10-10 jev-polls project thread, Giulio
