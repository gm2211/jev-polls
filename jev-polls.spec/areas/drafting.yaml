id: drafting
name: Drafting assistants
prose: >-
  The drafting assistant uses the user's ChatGPT subscription or an installed, authenticated Codex
  or Claude CLI to propose cohorts and studies. It cannot browse for evidence. Proposal (not yet
  decided, from the 2026-10-09 game-name demo request): connecting the user's own AI could become
  the main experience, with chat as the primary way to author a study, each request landing on the
  study canvas where steps can then be reconnected and edited by hand. Giulio: "maybe the main
  authoring experience should just be like I keep asking things in the chat and they get added to
  the pipeline canvas ... I'm not sure this is all up to you".
behaviors:
  - id: provider-choice
    description: >-
      The AI pill lets the user choose a drafting provider and model once for every cohort and
      study.
  - id: ready-provider-default
    description: When any drafting provider is ready, a ready one is selected by default.
  - id: proposals-explicit
    description: Proposals stay separate until the user applies them; discarding leaves the workspace unchanged.
  - id: isolated-agent-runs
    description: >-
      One drafting job runs at a time, prompts go via stdin, work happens in an isolated temporary
      directory with bounded time and output, cancellation stops it, and CLI diagnostics are never
      shown.
  - id: context-matched-panel
    description: Draft with assistant opened from Cohorts drafts cohorts; opened from Studies it drafts a study.
  - id: unsupported-credential-store
    description: >-
      Where no supported credential store exists, ChatGPT sign-in explains the limitation and
      points to Codex or Claude Code.
  - id: draft-attach-material
    description: >-
      The Build with words panel accepts one TXT, Markdown, CSV or JSON file up to 256 KiB, shows
      its name with a remove button, and sends it as untrusted source material; a list of names
      with descriptions becomes the options of every question that compares them.
  - id: draft-attach-recovered-name
    description: >-
      A drafting job keeps the name (never the content) of the file it was sent with; when the
      panel reopens a recovered job, it shows "Sent with this request: name" read-only until a new
      file is attached.
    source:
      text: After job recovery the attached material file chip is gone even though the job used it.
      reference: jev-polls demo recording, 2026-10-10
  - id: proposal-explanation-formatting
    description: >-
      A proposal's explanation renders paragraphs, bullets, ordered lists (on separate lines or
      inline after a colon), bold (including bold around inline code) and inline code with all
      provider text escaped; its summary is labeled (Cohorts, Studies, Steps), counts are
      pluralized, and they count only the selected project.
    source:
      text: Bold with inline code rendered as literal asterisks, numbered lists were not lists, and Studies 2 to 2 counted other projects.
      reference: jev-polls demo recording, 2026-10-10
  - id: draft-study-name-and-sample
    description: >-
      Drafts name a study with a short question of at most 80 characters, and no poll's sample
      size exceeds its cohort's persona count.
  - id: draft-with-large-cohorts
    description: >-
      Study drafting works in projects with large cohorts: a cohort too large to send is given to
      the provider as its metadata, persona count and a few example personas, marked as elided, and
      the assistant cannot change its personas. Its saved personas stay byte-identical, the
      proposal shows it as unchanged, and a request that is too large names what was too large and
      the selected provider.
    source:
      text: A 1,000-persona cohort made Draft pipeline refuse with a generic message that mentioned ChatGPT while Claude Code was selected.
  - id: drafting-job-recovery
    description: >-
      A running or finished-but-unapplied drafting job stays reachable after a reload or in a new
      tab: opening the project lists its jobs from the server and reattaches to the progress or
      proposal review, and the Cohorts list shows "Generating N personas" or "Ready to review"
      instead of the empty state. Applying or discarding in one tab ends the offer in others, and a
      second apply gets a clear "already applied" message.
    source:
      text: A running 1000-persona generation is invisible in a new tab and its finished proposal is unreachable.
  - id: proposal-references-resolve
    description: >-
      A proposal whose pipelines name a cohort id that is not in the resulting project fails the
      draft with a message naming the study and alias and listing the valid cohort ids; the id is
      never guessed or corrected. Large cohorts are sent with their exact id first and the provider
      is told to copy ids verbatim.
    source:
      text: audience pointed at a cohort id that mixes the cohort prefix with the study id's suffix; step 1 showed Needs cohort.
      reference: jev-polls project thread, 2026-10-10
  - id: study-name-short
    description: >-
      When a proposal is applied, a study name or research question over 120 characters is kept as
      its first sentence cut at a word boundary to at most 100 characters (with an ellipsis when cut),
      and the full text moves into the study context so nothing is lost.
    source:
      text: the assistant again set the study's name to a 5-line paragraph.
      reference: jev-polls project thread, 2026-10-10
  - id: draft-choice-output
    description: >-
      Drafting guidance states that a Choice question returns a probability for every option (a
      weighted ranking) with no written explanations, and keeps poll repeats at 1 unless the user
      asks for repeated sampling.
    source:
      text: A Choice question records only one pick. The full ranking is given in the chair's written explanation.
      reference: jev-polls project thread, 2026-10-10
