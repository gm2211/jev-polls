id: live-and-replay
name: Live voting and voting replay
behaviors:
  - id: live-in-place
    description: >-
      Run study opens Live voting where the study is, in place of the canvas, with Back to study and,
      once saved, Open report. Starting, watching and returning never leave the study.
    details: >-
      The view is addressable (hash `live=<run id>`), so reload and Back work. A study with runs also
      offers Live voting (while running) or Voting replay (after) in its header. Opening a run from
      the Runs list still shows the same view there.
    source:
      text: >-
        you must be able to produce a 1 minute demo that shows very simple, streamlined, almost
        guided process, without needing to jump between screens and with a compelling live voting view
      reference: 2026-10-10 jev-polls project thread, Giulio
  - id: live-fullscreen
    description: >-
      A started run, an opened run and a replay take the whole window: the app sidebar and page
      header are hidden, leaving a slim top bar with the study question, the status strip, Back to
      study and, once saved, Open report. Esc is Back to study. Fit all sizes tiles from the window
      (about 22px or more for a thousand tiles at 1440 by 900) and segment groups flow in a
      responsive grid; on a phone the leaderboard stacks under the map.
    details: >-
      Fit computes the largest tile that fits from the measured map box, not from fixed steps; 1:1
      and Large stay as overrides. Opening a run from the Runs list shows the same screen, and its
      Back goes to the study. Esc does nothing while a dialog or the command palette is open.
    source:
      text: >-
        a compelling live voting view, almost like a videogame ... at 1440x900 the map gets about
        810x500 px beside the sidebar, header, page title and a 300 px leaderboard, so tiles are 14 px
      reference: 2026-10-10 jev-polls project thread, Giulio
  - id: live-commentary
    description: >-
      A commentary ticker lists short lines derived only from the counts so far: lead changes, a
      segment's favourite changing, milestones at 25, 50, 75 and 100 percent, and segments that
      finish split. It keeps the last four, newest first, each with a timestamp; Replay shows the
      same lines in the same order.
    details: >-
      Lines come from walking the finished evaluations in finishing order, so a replay at any
      position equals what the live run said. Live lines are stamped with the clock time the view
      saw them; replay and finished runs show the vote count instead. Nothing is narrated beyond
      the data.
    source:
      text: >-
        Commentary ticker in the live view: short, data-derived lines as events happen ... no
        invented narrative; keep the last 4 lines, newest first, with a timestamp. Replay replays
        the same lines in order.
      reference: 2026-10-10 jev-polls project thread, Giulio
  - id: results-in-place
    description: >-
      When the run completes the live view becomes a results view without navigation: the
      leaderboard is the final ranking, a panel lists each segment's top three options, and one
      factual line says who leads overall and whether segments agree. Open report stays one click
      away.
    source:
      text: >-
        when the run completes, the live view turns into a results view without navigation ... a
        single factual summary line computed from the data
      reference: 2026-10-10 jev-polls project thread, Giulio
  - id: live-host-map
    description: >-
      Live voting and Voting replay draw one tile per persona evaluation (repeats are separate
      tiles) in a dense map grouped by segment, with group headers and counts. Fit all packs about
      a thousand tiles into the window; 1:1 and Large keep a fixed size and scroll. Newly finished
      tiles brighten for about a second and their group pulses once.
    details: >-
      Queued tiles are neutral, thinking tiles pulse, failed tiles are red with a cross, and finished
      tiles take the colour of the member's top pick (Choice) or a sequential colour for the Score
      mean or yes-probability. Colour by switches Status, Top pick and Confidence. Group by offers
      Segment, Age, every categorical attribute the cohort has (arrays group by their one item, or
      Several) and None. Hovering shows who they are, their segment, status and top pick with its
      probability; clicking opens the full answer and the synthetic-profile note at the top of the side panel,
      in place of the leaderboard until Back to ranking: every option's share to one decimal, highest
      first and in its map colour, the stated confidence, the model, a note that the model returns no
      written reasoning, and who the persona is (background and attributes as labelled fields).
      Added 2026-10-12 after Giulio asked to see the full output of a selected vote. The hover tooltip
      belongs to the pointer or to keyboard focus only: it is hidden on click, when the pointer
      leaves the map, on scroll, on Esc, on blur and when the selected member changes, and focus
      that came from a click never brings it back; the detail stays in the side panel. Tiles are
      focusable buttons with labels, and the arrow keys move between them. A step with few members
      draws large tiles with initials.
    source:
      text: >-
        observing the voting process should be almost like a videogame and using a view a bit like
        host map https://www.youtube.com/watch?v=SRg5kGSHzVY
      reference: 2026-10-10 jev-polls project thread, Giulio
  - id: live-leaderboard
    description: >-
      A leaderboard of every option (fourteen fit the full-height column) as racing horizontal bars
      shows each option's rank and weighted share to one decimal among the members evaluated so
      far, highlights the leader and animates smoothly, with a brief flash, when ranks change; it
      doubles as the colour legend.
    details: >-
      Option colours are fourteen muted colours per theme (OKLCH chroma at most 0.10, the dark set
      the same hues 0.1 lighter), searched to stay apart for a deuteranope; options from the eighth
      on also carry a stripe or dot pattern as a second cue. Muted on 2026-10-12 after Giulio said
      "colors too saturated".
      The share is the report's own measure (weighted mean of answer probabilities), so the final
      leaderboard equals the report. Runs saved before weights were kept count members equally and
      say so. Score questions show the level distribution and mean; yes/no questions show likelihood
      of yes.
    source:
      text: >-
        observing the voting process should be almost like a videogame and using a view a bit like
        host map https://www.youtube.com/watch?v=SRg5kGSHzVY
      reference: 2026-10-10 jev-polls project thread, Giulio
  - id: live-status-strip
    description: >-
      A strip shows evaluated of total, thinking, failed, evaluations per second over the last 20
      seconds and time left, and a progress bar. Speed starts at the first finished evaluation
      and is smoothed, so it ramps up instead of flickering from 0 to a burst. Tiles pop when they finish. Motion stops under
      prefers-reduced-motion.
    source:
      text: >-
        observing the voting process should be almost like a videogame and using a view a bit like
        host map https://www.youtube.com/watch?v=SRg5kGSHzVY
      reference: 2026-10-10 jev-polls project thread, Giulio
  - id: live-incremental-updates
    description: >-
      Each poll patches only the tiles whose status or answer changed, plus counters, the
      leaderboard and bars, in place; the thousand tiles are not rebuilt and the page's other
      controls keep focus, selection and scroll. A poll asks only for members that changed.
    details: >-
      One update costs a couple of milliseconds of script for a thousand members. Re-rendering the
      page shell (control changes, a new step, completion) rebuilds the map once.
    source:
      text: >-
        observing the voting process should be almost like a videogame and using a view a bit like
        host map https://www.youtube.com/watch?v=SRg5kGSHzVY
      reference: 2026-10-10 jev-polls project thread, Giulio
  - id: live-batch-progress
    description: >-
      A member who reads earlier answers in batches reports each finished batch and combine round,
      and its tile fills like a segmented ring until the combine round completes it.
    details: >-
      Members carry their layers (map batches, then combine rounds) as batch progress. Replay uses
      the layers recorded in the run to fill the next tile the same way.
    source:
      text: >-
        observing the voting process should be almost like a videogame and using a view a bit like
        host map https://www.youtube.com/watch?v=SRg5kGSHzVY
      reference: 2026-10-10 jev-polls project thread, Giulio
  - id: replay-on-map
    description: >-
      Voting replay drives the same map and leaderboard: tiles are revealed in the order their
      evaluations finished, and a replay never exposes an answer it has not reached.
    details: >-
      Runs saved before finishing order was kept replay in saved order and say so.
    source:
      text: >-
        observing the voting process should be almost like a videogame and using a view a bit like
        host map https://www.youtube.com/watch?v=SRg5kGSHzVY
      reference: 2026-10-10 jev-polls project thread, Giulio
  - id: live-narrow-screens
    description: >-
      On a phone the map scrolls inside its own box, the leaderboard stacks under it, and every
      control stays reachable without clipping; the top bar stays pinned.
  - id: run-graph-schema
    description: >-
      Live voting and Voting replay show the study as a graph of its steps, left to right, each with
      its status and what it reads and gives out; choosing a step shows its voting. Summary shows one
      line per step (for example "Audience + 2 steps → Choice · 3"); Inputs & outputs lists every
      field with its type and wires each output to the input that reads it.
    details: >-
      Types come from the study's own questions: Choice with its option count (or the step it takes
      options from), Scale with its levels, Yes / no; combine and final-answer steps take the type of
      the question they carry. Inputs name the audience, each earlier output and how it is read
      (summary, top option, shares, every answer, in batches, weight), and the step's run condition.
      Hovering a step or field gives the full field list. Summary is the default.
    source:
      text: the detailed run view should show schema of inputs and outputs in pipeline graph, both in live preview and in report
      reference: 2026-10-12 jev-polls project thread "run graph schema", Giulio
  - id: resilient-polling
    description: Live status survives transient fetch errors with a visible reconnecting notice.
  - id: replay-without-models
    description: >-
      Replay voting uses saved results, never calls a model, and states that its speed is
      illustrative rather than recorded timing.
  - id: replay-controls
    description: >-
      Replay offers play, pause, step, restart, show all, 1×/2×/4×/8× speed, and a position slider
      that updates while dragging. A whole replay takes four to forty seconds at 1× whatever its
      size.
  - id: evaluations-not-shares
    description: >-
      Tiles and counts describe evaluations of synthetic profiles, not audience share, and colours
      show model output, not observed human behavior.
