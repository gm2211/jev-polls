id: reports
name: Reports
behaviors:
  - id: standalone-offline
    description: Reports are standalone HTML with no network dependencies, fonts, or CDN.
  - id: escaped-content
    description: All untrusted text is escaped, and only http(s) source links are rendered.
  - id: provenance
    description: >-
      Reports state the recorded provider and returned model revisions, and mock reports are
      labeled demo data.
  - id: report-contents
    description: >-
      Reports include every step with skipped and failed branches, distributions, a per-segment
      comparison, respondent drilldown, source provenance, assumptions, a repeat summary, and raw
      JSON export.
    details: >-
      The segment comparison is a table of each segment's share for the leading options with each
      segment's favourite outlined, replacing the segment filter. Repeats are described in words
      ("Each person answered once", or "answered 3 times; the top option was the same every time")
      and per-repeat winners are listed only when they differ. Repeats never count as extra people.
  - id: one-page-answer-first
    description: >-
      The report is one page read top to bottom: the answer with a one-sentence reason, the results
      of each step, who answered, and how the run was made. It has no view tabs.
    details: >-
      The answer names the final result's top option, its share, its lead over the runner-up with a
      Close (under 5 points) or Clear label, and how many segments put it first. Later steps show
      their ranking with the segment table behind a "Show by segment" button; a Final result step
      is one line. Who answered is the seat map used by the live audience view, one square per
      person grouped by segment and coloured by their answer with the same option colours; with more than seven
      options only the six leading ones get a colour and the rest share one grey; selecting
      a square shows that person's answers as bars and their attributes as readable fields and
      chips. Internal terms (within-segment weight, confidence, weighted total, poll, aggregate,
      decision, repeat-level comparison) are not shown; run identifiers, request counts, the
      study hash, questions as asked and the study context sit under disclosures in How this was
      made. Decided 2026-10-12 from the respondent-records and By repeat screenshots.
    source:
      text: no clue what repeat is - overall report should be simplified and made more clear
      reference: jev-polls project thread "give me a few designs to restructure this part of the report", Giulio, 2026-10-12
  - id: method-names-each-cohort
    description: >-
      How this was made says, under each audience step, which cohort it asked and who is in it.
    details: >-
      Each finished audience step names its cohort (a link to the cohort in the workspace report),
      how many profiles answered out of how many, the age range, segment shares and the shares of
      any attribute the cohort has a generation target for (at most two), computed from the people
      who answered; whether the profiles were drafted by AI from a description or written by hand
      and how many sources they cite; and which earlier steps' answers it saw, or "No earlier
      answers". Steps saved under the old "Final choice" or "Final result" default names read as
      Final answer. Decided 2026-10-12.
    source:
      text: prob should include more detail about cohorts
      reference: jev-polls project thread on the report's How this was made section, Giulio, 2026-10-12
  - id: open-without-losing-edits
    description: Open report opens a separate tab so unsaved workspace edits stay intact.
  - id: consistent-style
    description: Reports share the workspace's visual language and vocabulary.
    details: >-
      The report embeds the workspace fonts and light and dark palettes, stacks the jev wordmark
      over a "Study report" caption like the workspace brand bar, and opens in the theme the
      workspace saved (else the OS preference). Hex colors and serif or monospace faces are not
      used, except the option colours shared with the live audience map. Decided 2026-10-10 from the UI audit ("the report looks like a different product").
    source:
      text: fix everything (audit item 12, report styling)
      reference: jev-polls project thread "UI audit in headless browser", Giulio, 2026-10-10
  - id: run-cost
    description: >-
      The report shows what the run cost: a Cost section before How this was made with the total
      (estimated dollars, requests sent, tokens, answers reused from earlier runs) and a per-step
      table, and the header line states the total.
    details: >-
      Dollars are the tokens the run actually spent at the observed TypeSafe rate used by the
      pre-run estimate. Answers reused from saved runs are free, skipped steps cost nothing, demo
      and GLiNER runs say nothing was billed, and runs saved before steps recorded their own usage
      show only the total.
    source:
      text: we should include cost of study in recap view and in report
      reference: jev-polls project thread "Study cost in recap and report", Giulio, 2026-10-12
