id: cohorts
name: Cohorts
prose: >-
  A cohort is a weighted set of adult synthetic personas with sources, segments, assumptions, and
  optional distribution targets. Drafts accept incomplete work; review applies the full runnable
  rules (for example draft ages 0–120 versus runnable 18–120).
behaviors:
  - id: adults-only
    description: Runnable cohorts contain only adult personas aged 18 to 120.
  - id: strict-validation
    description: >-
      Runnable cohorts reject unknown fields, duplicate IDs, unresolved source or segment
      references, and source URLs that are not http(s) or embed credentials.
  - id: weight-basis
    description: >-
      Every segment weight states its basis (sourced, assumed, or user); a sourced weight cites at
      least one source, at least one segment has positive weight, and every positive-weight segment
      has a persona.
  - id: source-provenance
    description: Each source records its URL, retrieval date, what it supports, and its limitations.
  - id: synthetic-fields-labeled
    description: Each persona lists which of its fields are synthetic, and the workspace shows that distinction.
  - id: cohort-share-visible
    description: Each persona row shows its effective cohort share.
  - id: distribution-targets
    description: >-
      Distribution targets on age, segment, or an attribute accept buckets totaling 100 percent
      within 0.01 and allocate exactly the requested persona count.
  - id: distribution-array-items
    description: >-
      A distribution of an array attribute charts each item separately as the share of personas
      that include it (shares can exceed 100 percent), says so in its note, and still discloses
      missing values.
    source:
      text: favoriteFranchises was charted as whole combinations, giving 96 pages of one-off combos.
      reference: jev-polls demo recording, 2026-10-10
  - id: empty-cohorts-copy
    description: >-
      The empty Cohorts prompt says the user's drafting AI drafts segments and personas; Jev
      supplies judgments only and never drafts personas.
    source:
      text: Jev does not draft personas; the user's drafting AI does.
      reference: jev-polls demo recording, 2026-10-10
  - id: new-cohort-page
    description: >-
      The New cohort page opens quiet: the prompt field, the persona count, Generate cohort and
      Create manually side by side, and no warning until the user presses Generate with an empty
      description, which then shows the hint and focuses the field.
    details: >-
      The Cohorts breadcrumb is the way back, so the page has no extra back button except Back to
      study when it was opened from a step. Changed 2026-10-10 from a page that warned on first load,
      disabled Generate, showed a one-tab section bar and hid Create manually under the fold.
    source:
      text: New cohort page scolds before you type (UI audit, item 13)
      reference: jev-polls project thread "UI audit in a headless browser", 2026-10-10
  - id: manual-editing
    description: >-
      Users can create a cohort manually and add, edit, or remove personas, segments, and sources
      without the drafting assistant.
  - id: persona-page
    description: >-
      A persona is one page: profile fields, background, attributes and evidence are edited in
      place in a main column, weight and Remove persona sit beside them, and Regenerate is a
      header button that opens the replacement panel above the page.
    details: >-
      Replaced on 2026-10-10 a five-tab layout (Background, Attributes, Weight & sources, Edit with
      three sub-tabs, Regenerate) that split six fields across tabs and hid the edit form behind a
      second tab row. Previous and Next step through the cohort from the header.
      Since 2026-10-11 attributes appear once, in the editable JSON field; the read-only copy of
      the same values above it was removed.
    source:
      text: "Persona page: five tabs for six fields (UI audit, item 9)"
      reference: jev-polls project thread "UI audit in a headless browser", 2026-10-10
  - id: persona-browsing
    description: >-
      Persona lists paginate with stable page membership, can be grouped by attribute, and stay
      usable for a 20,000-persona cohort.
  - id: persona-group-menu
    description: >-
      The Group personas by menu lists each attribute once however persona batches spelled it, under
      headings: Profile, Attributes, one heading per attribute object, and On some personas only (with
      how many personas carry it).
    details: >-
      Spellings that differ in case, separators or a plural, an attributes object nested inside
      attributes, and fields with the same name that no persona carries together share one choice;
      grouping reads whichever spelling a persona has. Headings are native optgroups, so the menu stays
      a plain select.
    source:
      text: >-
        flexible grouping is good, but maybe there's a better way to present this / a way of making
        this menu hierarchical
      reference: 2026-10-12 jev-polls project thread, Giulio
  - id: cohort-page-fixed-header
    description: >-
      On a cohort's Personas tab the cohort title, its section tabs and the page around them stay in
      place; only the persona rows scroll, inside a panel capped at the window's remaining height,
      with the pager directly under the rows.
    details: >-
      Paging stays the main way through a large cohort (12 per page on desktop, 6 on phone widths,
      interface-quality.pagination-in-flow); the rows scroll only when a page is taller than the
      window. The header is two rows: the title with Back to study, save status and Delete on its
      right, then the persona count and About this cohort on one line. Section tabs stay on one row
      on phones. A very short window (zoom) keeps a 360px panel and lets the page scroll.
    source:
      text: list can scroll though pagination is better but not title and rest of ui
      reference: >-
        2026-10-12 jev-polls project chat, Giulio, with a screenshot of a 1,000-persona cohort whose
        title scrolled away; follow-up "so much vertical space wasted - we need more inlining"
  - id: cohort-autosave
    description: >-
      Cohort and persona pages have no Save button: each edit saves on its own shortly after it is
      made, and the header shows "Saving…", "All changes saved", or why the edit is not saved yet.
    details: >-
      Chosen 2026-10-12 under Giulio's standing approval, replacing explicit Save on these pages
      (projects.explicit-save stays for studies and project settings). Saving does not re-render the
      page, so the field being typed in keeps focus; an edit made while a save is in flight stays
      unsaved and goes in the next save. Invalid fields or a workspace changed elsewhere stop
      autosave and are named in the status, without a browser validation popup. Autosave waits while
      a drafting job runs, so a pending persona replacement is not invalidated. A generated cohort
      that is adopted onto its cohort page is saved straight away.
    source:
      text: also the save button is unclear what it does, maybe get rid of it?
      reference: 2026-10-12 jev-polls project chat, Giulio, on the cohort page header
  - id: content-addressed-import
    description: cohort import stores an immutable revision named by the cohort ID and a content hash.
  - id: sampling-preserves-weights
    description: >-
      cohort sample draws distinct profiles without replacement from a seed, keeps segment weights,
      records an assumption, and refuses to overwrite an existing file.
