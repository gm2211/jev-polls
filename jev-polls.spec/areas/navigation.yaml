id: navigation
name: Navigation and search
prose: >-
  The open view is kept in the URL hash, so reloading the page returns to it, and every move
  between views adds a history entry, so the browser's Back and Forward buttons step through them.
behaviors:
  - id: history-navigation
    description: >-
      Opening a project, tab, study, step, cohort, persona, run, or the Projects list adds a browser
      history entry; Back and Forward restore those views without leaving the workspace, and
      editing the hash in the address bar opens that view.
    details: >-
      Restoring a view flushes open forms first (an invalid form shows its error and keeps the
      view), clears any item the hash no longer names (closed cohort, persona, run, or composer),
      and the first paint and restores replace the entry rather than adding one.
    source:
      text: "fix everything (from the UI audit: three clicks in, Back leaves the site)"
      reference: jev-polls project thread "UI audit in headless browser", Giulio, 2026-10-10
  - id: browser-tab
    description: >-
      The browser tab shows the Jev poll-results icon and a title that leads with the open page
      (project, study, cohort, persona, Runs, Settings, or Projects) and ends with "Jev", so the
      useful part survives truncation.
    details: >-
      Names longer than 40 characters are clipped at a word with an ellipsis. A leading "• " marks
      unsaved changes, and a running study adds its percent complete in front. The same mark replaces
      the "J" square in the wordmark. Saved reports use "<study> · Report · Jev" and the same icon.
      Proposal (2026-10-12): the icon design and title format were chosen by Claude under the
      project's standing authorization.
    source:
      text: let's find a better icon and way of showing tab
      reference: jev-polls project thread "Better tab icon and title", Giulio, 2026-10-12
  - id: reload-keeps-view
    description: >-
      Reloading the page reopens the same project and tab, plus the open study and step, cohort and
      persona, or run; a link to a missing project or item falls back to the nearest view that exists.
    details: >-
      The view lives in the URL hash (project, tab, study, step, cohort, person, run). Unsaved edits
      are not part of it; the browser still asks before a reload discards them.
    source:
      text: if I hit refresh it goes back
      reference: jev-polls project thread "Edits lost on refresh", 2026-10-09
  - id: breadcrumbs
    description: >-
      The breadcrumb trail shows where the page sits in the hierarchy, not the click history: every
      level from Projects down, each a link to that level, ending with the current page as plain text,
      and every page's big heading names that same last crumb.
    details: >-
      Levels are Projects / project / section (Studies, Cohorts, Runs, Project settings) / item
      (study, cohort, run) / Before you run or Study settings, and cohort persona or New cohort /
      Regenerate personas. Moving down adds exactly one level; opening a study lands on its canvas
      with no step open. The step panel is an overlay on the study page, so it adds no level, and
      since 2026-10-10 step settings are a Settings tab of that panel rather than a page of their
      own (study-journey.round-panel). Giulio
      named the root cause on 2026-10-09: "we're switching styles all of a sudden from 1st where
      Studies is big and not in breadcrumbs to a style where things are in breadcrumbs". Long labels are cut with an ellipsis and keep the
      full text as a tooltip. On phone widths only the parent and current levels show, on one row. Rules follow common guidance (NN/g "Breadcrumbs: 11 Design
      Guidelines", GOV.UK and Carbon breadcrumb patterns): hierarchy not history, start at the top
      level, current page last and not a link, one row, no repeated back buttons.
    source:
      text: I still find this behavior odd i.e. jumping 2 levels of breadcrumbs - research how breadcrumbs work
      reference: >-
        jev-polls project chat, Giulio, 2026-10-09, with screenshots of the Studies list trail
        ending at the project and a study opening straight into step settings
  - id: page-anatomy
    description: >-
      Every workspace page reads as brand bar, then (inside a project) the project sidebar beside
      the page, whose content starts with the breadcrumb trail and one page header.
    details: >-
      The breadcrumb row holds only the trail. Project sections (Studies, Cohorts, Runs, Settings)
      live in the sidebar (study-journey.project-sidebar), not in a tab row. Every page's trail
      includes its section, including the section page itself (navigation.breadcrumbs). Replaced the
      top tab row on 2026-10-09 per the redesign thread.
    source:
      text: navigations an breadcrumbs are still a little awkward - the positioning of some controls and title also is
      reference: project thread, Giulio, 2026-10-09
  - id: tabs-follow-breadcrumbs
    description: No section tab row sits between the breadcrumb trail and the page header.
    details: >-
      Section navigation moved to the project sidebar on 2026-10-09. The earlier rule that a
      section page's trail stops at the project (to avoid echoing the tab row) was dropped the same
      day once the tab row was gone, because it made opening a study jump two levels
      (navigation.breadcrumbs).
    source:
      text: the positioning of the tabs wrt breadcrumbs is confusing
      reference: project chat, Giulio, 2026-10-09
  - id: brand-not-breadcrumb
    description: The app name lockup in the top bar never reads as a breadcrumb level.
    details: The wordmark stacks "jev" over a small "Research desk" caption with no slash separator.
    source:
      text: also this look like a breadcrumb too
      reference: project thread, Giulio, 2026-10-09 (screenshot of the "jev / research desk" wordmark)
  - id: no-duplicate-back
    description: >-
      Pages do not repeat a back button whose target is already the previous breadcrumb; a back
      button appears only for a return the trail does not show, such as Back to study.
    details: >-
      Step settings were a page reached from the trail (study / Step N settings) until 2026-10-10,
      when they became a tab of the step panel, so there is no page to return from.
  - id: header-actions-on-title-line
    description: >-
      Page header actions align with the title line, and Save is a labeled button that leads the
      action group on every page.
  - id: command-palette
    description: >-
      Cmd+K (Ctrl+K elsewhere) searches every workspace destination, including unsaved edits;
      arrow keys move through every result and Enter opens it.
  - id: platform-shortcut-hint
    description: The shortcut hint shows ⌘ K on macOS and Ctrl K elsewhere.
  - id: ask-ai
    description: >-
      Ask AI or Shift+Enter sends a natural-language request that can search, navigate to a
      validated result, or open a prefilled creation or editing flow, without saving or running.
  - id: palette-scope
    description: >-
      The palette knows where it was opened: a chip in the search bar names the open step, study,
      cohort, run or project, and Ask AI from a study or step with steps sends the request straight
      to the drafting assistant with that study (and step) as its focus. The proposal opens in the
      drafting panel as a reviewable, step-by-step diff; nothing changes until Apply, and Undo (or
      Cmd/Ctrl+Z) restores the study while nothing has changed since.
    details: >-
      Clearing the chip (its close button, or Backspace in an empty search) searches everywhere and
      sends Ask AI to the command router as before; reopening the palette starts from the current
      view again. Search results are unchanged by the scope. The drafting panel names the study it
      will change ("Changing …") with a Draft anything button that drops the focus. The focus is
      recorded on the job, so a reload restores it. Cohort, run and project scopes are shown but
      still use the command router.
    source:
      text: cmd+k should be context aware - e.g. I should be able to ask my assistant to modify my study
      reference: 2026-10-12 jev-polls project thread, Giulio
