id: navigation
name: Navigation and search
prose: >-
  The open view is kept in the URL hash, so reloading the page returns to it. Open proposal (not
  yet accepted): Back and Forward stepping through views (today navigation replaces the URL
  instead of adding history entries, docs/ux-review §1).
behaviors:
  - id: reload-keeps-view
    description: >-
      Reloading the page reopens the same project and tab, plus the open study and step, cohort and
      persona, or run; a link to a missing project or item falls back to the nearest view that exists.
    details: >-
      The view lives in the URL hash (project, tab, study, step, cohort, person, run). Unsaved edits
      are not part of it; the browser still asks before a reload discards them.
    source:
      text: if I hit refresh it goes back
      reference: jev-polls project thread "Edits lost on refresh", 2026-10-09
  - id: breadcrumbs
    description: >-
      The breadcrumb trail shows where the page sits in the hierarchy, not the click history: every
      level from Projects down, each a link to that level, ending with the current page as plain text.
    details: >-
      Levels are Projects / project / section (Studies, Cohorts, Runs, Project settings) / item
      (study, cohort, run) / study step / step Settings or Review run, and cohort persona or
      regeneration. Moving down adds exactly one level; opening a study lands on its canvas with no
      step open, and selecting a step adds it. Long labels are cut with an ellipsis and keep the
      full text as a tooltip. On phone widths only the parent and current levels show, on one row. Rules follow common guidance (NN/g "Breadcrumbs: 11 Design
      Guidelines", GOV.UK and Carbon breadcrumb patterns): hierarchy not history, start at the top
      level, current page last and not a link, one row, no repeated back buttons.
    source:
      text: I still find this behavior odd i.e. jumping 2 levels of breadcrumbs - research how breadcrumbs work
      reference: >-
        jev-polls project chat, Giulio, 2026-10-09, with screenshots of the Studies list trail
        ending at the project and a study opening straight into step settings
  - id: page-anatomy
    description: >-
      Every workspace page reads as brand bar, then (inside a project) the project sidebar beside
      the page, whose content starts with the breadcrumb trail and one page header.
    details: >-
      The breadcrumb row holds only the trail. Project sections (Studies, Cohorts, Runs, Settings)
      live in the sidebar (study-journey.project-sidebar), not in a tab row. Every page's trail
      includes its section, including the section page itself (navigation.breadcrumbs). Replaced the
      top tab row on 2026-10-09 per the redesign thread.
    source:
      text: navigations an breadcrumbs are still a little awkward - the positioning of some controls and title also is
      reference: project thread, Giulio, 2026-10-09
  - id: tabs-follow-breadcrumbs
    description: No section tab row sits between the breadcrumb trail and the page header.
    details: >-
      Section navigation moved to the project sidebar on 2026-10-09. The earlier rule that a
      section page's trail stops at the project (to avoid echoing the tab row) was dropped the same
      day once the tab row was gone, because it made opening a study jump two levels
      (navigation.breadcrumbs).
    source:
      text: the positioning of the tabs wrt breadcrumbs is confusing
      reference: project chat, Giulio, 2026-10-09
  - id: brand-not-breadcrumb
    description: The app name lockup in the top bar never reads as a breadcrumb level.
    details: The wordmark stacks "jev" over a small "Research desk" caption with no slash separator.
    source:
      text: also this look like a breadcrumb too
      reference: project thread, Giulio, 2026-10-09 (screenshot of the "jev / research desk" wordmark)
  - id: no-duplicate-back
    description: >-
      Pages do not repeat a back button whose target is already the previous breadcrumb; a back
      button appears only for a return the trail does not show, such as Back to study.
    details: Step settings use the trail (study / Step N / Settings) instead of a Back to flow button.
  - id: header-actions-on-title-line
    description: >-
      Page header actions align with the title line, and Save is a labeled button that leads the
      action group on every page.
  - id: command-palette
    description: >-
      Cmd+K (Ctrl+K elsewhere) searches every workspace destination, including unsaved edits;
      arrow keys move through every result and Enter opens it.
  - id: platform-shortcut-hint
    description: The shortcut hint shows ⌘ K on macOS and Ctrl K elsewhere.
  - id: ask-ai
    description: >-
      Ask AI or Shift+Enter sends a natural-language request that can search, navigate to a
      validated result, or open a prefilled creation or editing flow, without saving or running.
