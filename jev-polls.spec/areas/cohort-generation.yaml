id: cohort-generation
name: Cohort generation
prose: >-
  Generation turns a short audience brief into an editable cohort through the selected drafting
  provider. It proposes; the user adopts.
behaviors:
  - id: saves-before-generating
    description: >-
      Generate cohort validates and saves current edits first; a failed save or conflicting revision
      leaves the draft intact and does not start generation.
  - id: readiness-explained
    description: >-
      Generate cohort is disabled with a visible reason when the persona count or the drafting
      provider is not ready; an empty brief alone keeps the button enabled and shows its reason
      only after the user presses it (cohorts.new-cohort-page).
    details: Changed 2026-10-10 so the New cohort page does not warn before the user has typed.
  - id: truthful-progress
    description: >-
      Generation progress shows real job counts, elapsed time, and observed activity; estimates
      are labeled as uncertain, and no progress or model reasoning is invented.
    source:
      text: Use real job counts, elapsed time, and observed activity in the generation readout.
      reference: docs/design-direction.md
  - id: batched-and-validated
    description: >-
      Cohorts up to 20,000 personas are generated in validated batches; changed metadata, wrong
      counts, quota mismatches, or invented sources reject the whole proposal, and nothing partial
      is published.
  - id: concurrent-batches
    description: >-
      A cohort of more than 25 personas first gets its details (segments, weights, sources,
      assumptions) from one setup call that writes no personas; then every persona batch can start at
      once, sixteen at a time (up to 48 on Claude Code, by the machine's cores and memory), each
      writing only personas, and persona IDs and order follow batch position, never completion order.
    details: >-
      Changed 2026-10-11 (second time that day) after a 1,000-person run still showed about 7 to 18
      minutes left. Measured with Claude Code on 400 personas: before, a 10-persona first batch ran
      alone (28 s) and every later batch rewrote and recopied the whole cohort details (about 2,000
      characters, roughly 600 tokens of each batch), in two rounds of twelve: 3 min 57 s, including
      one slow batch of 3 min 24 s. After, a setup call (19 s), then sixteen 25-persona batches at
      once (41 to 53 s each): 1 min 18 s. CLI startup was about 3 s per call and streaming speed
      stayed about 170 output tokens per second per batch with sixteen at once, so the time is
      writing personas, and running more at once is what shortens it. Batches are split evenly so
      the last round of sixteen is full: 1,000 personas are 48 batches of 20 or 21 in three rounds
      (instead of 40 of 25 in four), and no batch is smaller than about ten. A saved cohort being
      regenerated already has its details, so it needs no setup call. A cohort of up to 25 personas
      is still one batch that also sets the details. Each batch is given its segment mix
      (segmentMix), whole-person counts in proportion to segment weights with at least one person
      for every positive-weight segment, unless a saved segment target already assigns segments.
      Batches return a JSON array of personas; the cohort details are never read from a batch reply,
      so a batch cannot change them.
  - id: lean-persona-batches
    description: >-
      A persona batch writes only what differs between people (label, segment, age, background,
      attributes, and sourceIds when it cites a source); the app fills ids, weight 1, empty sourceIds
      and every written field marked synthetic. Claude Code, ChatGPT and API engines return the batch
      as real JSON, and Claude Code writes persona batches at low effort.
    details: >-
      Added 2026-10-11 after "also still too slow, please have a deep investigation thread to explain
      why it takes this long to generate 1000 json things". Measured on a real 1,000-person Claude Code
      run (Sonnet, sixteen batches at once, 48 batches of 20 or 21): 2 min 39 s, of which the setup
      call was 15 s and each batch about 43 s (2.4 s CLI start, 3.6 s thinking before the first
      persona, 33.5 s streaming at about 190 tokens per second). Batches wrote 319,000 output tokens,
      about 320 per persona: four fields were the same for every persona (id, weight, sourceIds,
      syntheticFields) and the personas were escaped inside the documentJson string with an
      explanation. Writing only the differing fields as real JSON cut a 21-person batch from 7,218 to
      4,509 output tokens; low effort cut Opus thinking from about 2,000 tokens to about 120 per batch
      (77.9 s to 43.6 s for the same batch). After: 190,000 output tokens and 1 min 52 s for 1,000
      Sonnet personas, about 28 s per batch. Codex keeps the documentJson string because its output
      schema needs named properties. A CLI that rejects --effort is asked again without it, and later
      batches skip it. The setup call keeps the default effort, since it decides segments and weights;
      its instructions now spell out the distribution-target bucket rules, because a real Opus setup
      reply gave a numeric bucket a value, failed its check, and cost a serial 29 s retry.
    source:
      text: also still too slow, please have a deep investigation thread to explain why it takes this long to generate 1000 json things
      reference: 2026-10-11 jev-polls project thread, Giulio
  - id: audience-speed
    description: >-
      On Claude Code, audience generation (the setup call and persona batches) runs on Sonnet at low
      effort with thinking off, persona batches come back as a table (fields named once, one row of
      values per persona), up to 48 batches run at once by machine size, and the first round's batch
      processes are started during the setup call so they need only the rest of their prompt.
    details: >-
      Added 2026-10-11 after "this is still too slow - it should take no longer than 30 seconds" (a
      1,000-person run took 1 min 59 s). Writing speed per stream is fixed by the model (Sonnet about
      150 to 170 output tokens/s, Opus about 117), so the levers are fewer tokens and more streams.
      Opus took 3 min 16 s against Sonnet's 1 min 52 s with the same code, and Haiku thought for
      1,700 to 6,000 tokens a batch with no way to turn it off, so Sonnet is pinned for audience calls
      (a CLI or account without --model or --effort is asked again without both, and later calls skip
      them). MAX_THINKING_TOKENS=0 cut thinking to about 250 tokens a batch. The table cut a 21-person
      batch from 3,921 to 2,634 written tokens. 48 Sonnet streams at once hit no rate limit, but each
      Claude Code batch is its own process (about 240 MB and 1.6 CPU-seconds), so concurrency is four
      per core and half the memory, between 16 and 48 (JEV_CONCURRENT_BATCHES overrides it); other
      engines keep sixteen until their limits are measured. Warm processes start at niceness 10 so
      they do not slow the setup call, and unused ones are stopped when the job ends or is
      cancelled. The setup reply is kept short (one-sentence segments and description, at most four
      assumptions), since every persona waits for it. Measured on a 4-core, 16 GB container with
      1,000 people: 1 min 59 s before; 62.6 s with 48 at once; 55.2 s with warm processes (setup
      15.6 s, then 12.6 s median for 48 CLIs to send their request, then about 19 s writing). The
      remaining CLI time is CPU contention, so a machine with more cores is faster.
    source:
      text: this is still too slow - it should take no longer than 30 seconds
      reference: 2026-10-11 jev-polls project thread, Giulio
  - id: slow-batch-second-request
    description: >-
      A batch attempt running far longer than the accepted batches gets one second, identical request;
      the first reply is checked and the other request is stopped, and it is never counted as a retry.
    details: >-
      Added 2026-10-11 after one batch of a 400-person Claude run streamed at a quarter of the usual
      speed and took 3 min 24 s while its fifteen peers took about 50 s, holding up the finish. A
      second request starts only after three batches are accepted, once an attempt has run 1.5 times
      the median accepted time per persona for its size and at least 30 s, only in a place the
      concurrency window leaves free (so the bulk of a job never sends more requests at once than its
      concurrency), and never while a rate limit, overload or connection error has narrowed the window. The
      batch shows as hedged, its progress is the further of the two requests, and the server logs a
      cohort-batch-hedged line. The setup call and every first batch also check distribution targets
      the way the final check does: a real setup reply named a target field "country" instead of
      "attributes.country", passed its batch, and failed the finished audience after every batch.
    source:
      text: generation is way too slow, why?
      reference: 2026-10-11 jev-polls project thread, Giulio, with a screenshot of batch 1 of 41 at 1 min 19 s
  - id: batch-retry
    description: >-
      A batch that fails parsing or checks is retried with the same request data up to two more times,
      with the reason it was rejected added to the instructions, before the whole job fails with the
      workspace unchanged; cancellation never retries.
    details: >-
      Added 2026-10-11 (gap left by the per-batch failure reasons): a batch that fails because the AI
      was rate-limited, overloaded or unreachable (a CLI error result with status 429, 529 or 5xx, an
      "overloaded" or "rate limit" message, a connection reset or a timeout) is not a bad reply, so
      the same request is sent again after an exponential wait with jitter (about 5 s, then 20 s,
      then 60 s for a batch's later attempts, each 20% either way) and without a rejection note.
      Failed checks and unreadable replies keep the immediate retry with the reason. While any such
      error is live, no more than four batches are started at once; the limit lifts back to the job's
      full concurrency after two accepted batches in a row, and another such error restarts that count. The attempt
      limit is still three, so only the first two waits occur before a batch fails the job. A waiting
      batch shows "waiting 20 s after a rate limit (attempt 2 of 3)" and the panel says "4 batches at
      once while the AI is rate-limited", so the displayed wait and window are the real ones.
      Cancelling ends a wait at once. CLI and MCP behaviour is unchanged apart from the waits. A
      persona batch that returns fewer people than asked, all passing their checks, keeps them, and its
      next attempt asks only for the missing positions and segment mix (two of 48 low-effort batches
      came back one person short in a real run, and each full redo cost about 25 s); extra people
      are dropped. Neither applies with distribution targets, whose slots are matched by position.
  - id: generation-failure-detail
    description: >-
      A failed generation says which batch failed and which check it failed ("Batch 7 failed its
      checks 3 times: persona 3 has no segment. Workspace unchanged."), the server logs one JSON line
      on stderr for every failed batch attempt and for the final failure, and the failed panel offers
      Start again with the same brief and size, or Continue when checked personas were kept
      (generation-survives-restart).
    details: >-
      Added 2026-10-11 after a 1,000-person run failed after about nine minutes with only "Agent did
      not return a valid workspace draft" and nothing in the server log. Every batch reply is now
      checked in its own batch for valid JSON, the cohort format (naming the persona and field, such
      as "persona 3 has no segment"), the cohort id, the persona count, details copied exactly from
      the saved cohort (one-batch cohorts), and that each persona names a segment and sources the
      cohort has; the setup call of a larger cohort is checked the same way for its details and fails
      as "Setting up the audience failed its checks 3 times: …"; before this,
      a persona with an unknown segment passed its batch and failed only the final check, after
      every batch had been paid for, with no reason given. Each log line carries the job id, batch
      index, attempt, reason and the first 300 characters of the offending output; a failure of the
      AI call itself (CLI exit status, an error result, a reply without documentJson) is reported the
      same way. Setting JEV_AGENT_DEBUG_DIR writes the prompt, stdout, stderr and exit status of every
      drafting CLI call to that directory for diagnosis. A failure in the final whole-cohort checks
      names the check as well. The Claude stream-json stdout limit is four times the reply limit,
      because the stream repeats the reply (a 25-persona batch measured 545 KB against 1,000 KB).
    source:
      text: >-
        Generation failed · Agent did not return a valid workspace draft. Try a smaller or more specific
        request. Workspace unchanged.
      reference: 2026-10-11 jev-polls project thread, Giulio's failed 1,000-person run
  - id: concurrent-progress-truthful
    description: >-
      Progress says in plain words how many groups are being written at once and when a rate limit or
      a failed check slows it down, without batch numbers or attempt counts, and divides the
      remaining-time range by the batches running at once.
    details: >-
      Changed 2026-10-11: the readout no longer lists batch numbers, per-batch states, character counts
      or CLI output; one status line covers planning the audience, writing, pauses and final checks.
  - id: streamed-generation-detail
    description: >-
      While batches draft, the main count is personas written so far (checked plus seen in partial
      output), so it moves as people arrive; personas checked and saved are a separate, smaller number,
      and a rough finish time appears from the first seconds. Personas seen in partial output are never
      counted as checked before their batch passes its checks.
      Until the first persona arrives, the readout says whether the groups are waiting for the AI,
      thinking before they write, or writing (for example "Groups: 12 thinking, 4 waiting to start").
    details: >-
      Streamed personas are counted from partial CLI output and capped at the batch size. The Claude CLI
      runs in stream-json mode with partial messages, so its content deltas arrive as JSON lines while
      the batch is written; only deltas are counted (the repeated assistant and result events are not),
      the final result is read from the result event, and a CLI that rejects the streaming flags is rerun
      in plain JSON mode with the result printed only at the end. The Codex CLI runs with its JSON event
      stream, which currently reports a message only once complete, so its batches show no persona count
      until they finish. Every restriction flag stays on. Batch states
      are connecting, writing (persona N of size), checking, retrying after a failed check (attempt N of
      3) and accepted. ChatGPT streams only counters, so its batches show tokens so far and no persona
      count. The early estimate is labeled rough and gives way to the batch-based estimate after two
      batches complete. While the setup call runs, the status reads "Setting up the audience: segments,
      weights and assumptions, then 16 batches run at once".
    source:
      text: >-
        why am i not getting details about what's going on - 2mins almost and still 0/1000 is very
        confusing
      reference: 2026-10-11 jev-polls project thread, Giulio
  - id: proposal-then-adopt
    description: >-
      A generated cohort stays a proposal until the user chooses Review and edit cohort; Discard
      version leaves the workspace unchanged, and only the selected cohort can change.
  - id: stale-proposal-refused
    description: A proposal based on an older revision cannot be adopted and must be regenerated.
  - id: generation-survives-restart
    description: >-
      A cohort run keeps its audience plan and every checked group of personas on disk, so after a
      failure or an app restart it shows as stopped with how many personas were kept, and Continue
      writes only the missing groups with the same plan, brief, size and persona IDs. A run the app no
      longer knows is stated as stopped with nothing kept, never as still working or a connection
      problem, and progress keeps checking on its own while the app cannot be reached.
    details: >-
      Added 2026-10-11 after a 1,000-person run showed "Assistant task was not found" with a
      Reconnect button that could not work: runs lived only in memory, so an app restart erased
      them. Checkpoints are JSON files in the workspace's drafts folder (mode 0600), replaced in one
      step after the audience plan is set and after each accepted group, and removed when the run is
      applied, discarded, cancelled or continued. Continue is refused unless the brief, size, audience
      id and project match the stopped run. Start over writes everything again. Runs that stopped
      before this change cannot be recovered.
    source:
      text: huh? also reconnect does not work
      reference: 2026-10-11 jev-polls project thread, Giulio
  - id: audience-draft-kept
    description: >-
      A step's audience description and count are kept in the browser as they are typed and with
      every run started from them, so a page refresh shows them again, and a remembered run the app
      no longer has comes back after a refresh as stopped with that description and Start again.
      They are forgotten only when the audience is used for the step.
    details: >-
      Added 2026-10-12 after a refresh emptied the Who answers form back to 8 people and lost the
      written description. Kept in localStorage per project and step; the AI choice was already kept.
    source:
      text: >-
        why did I lose my prose when page refreshed - if we have issues with generation we should
        keep the attempt around so I can retry instead of losing everything
      reference: 2026-10-12 jev-polls project thread, Giulio
  - id: cancel-generation
    description: Cancel generation stops the job and leaves the workspace unchanged.
  - id: regenerate-persona
    description: Regenerating one persona keeps its ID, segment, and weight and may cite only existing sources.
  - id: no-inference-from-generation
    description: Generation never starts a study evaluation.
