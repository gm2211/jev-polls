id: execution
name: Execution
prose: Deterministic, bounded, validated execution of a reviewed study.
behaviors:
  - id: topological-parallel
    description: Steps run in dependency order, and ready steps run in parallel under one global concurrency limit.
  - id: request-budget
    description: New provider requests never exceed the request limit; cache hits do not count.
  - id: seeded-sampling
    description: >-
      Sampling is stratified by segment, without replacement, from the run seed, with at least one
      persona per positive-weight segment; Choice option order is shuffled per request from the seed.
  - id: batched-per-persona
    description: All questions for one persona in a step go in one request; unrelated personas stay isolated.
  - id: validated-before-use
    description: >-
      Provider answers are validated (IDs, types, distributions summing to 1, consistent winners and
      means) before caching or aggregation; malformed answers fail the respondent.
  - id: probability-rounding-tolerance
    description: >-
      Jev reports probabilities rounded to two decimals, so a returned Choice or Score distribution
      within that rounding (0.005 per option, at least 0.001) of summing to 1 is accepted and
      renormalized; larger errors still fail the respondent as invalid.
  - id: exact-response-cache
    description: >-
      Validated responses are cached by provider, endpoint, and exact request and revalidated on
      read; --refresh bypasses the cache.
  - id: failed-respondent-fails-step
    description: >-
      One failed respondent fails its step; descendants are skipped, the run is marked failed, and
      partial results are saved.
  - id: skipped-source-skips
    description: A Combine answers or Final result step whose source was skipped is itself skipped, not failed.
  - id: repeats-not-people
    description: Repeats are averaged per persona and never increase the respondent count.
  - id: locale-independent-hashes
    description: Study hashes, cache keys, and derived seeds are identical regardless of OS locale.
  - id: decision-keeps-uncertainty
    description: A Final result step copies its source summary, including uncertainty, and declares a selection without manufacturing certainty.
  - id: request-size-guard
    description: >-
      The engine measures each request before sending and never sends one over a Jev limit; that
      respondent fails with a clear reason, which fails its step.
    source:
      text: >-
        we're gonna have one Jev for each persona so we need to make sure that the collective size of the question with all the options and the backstory for the persona, any detail and context about the persona, those things have to be within the limits for Jev otherwise it's just not gonna work.
      reference: 2026-10-09 jev-polls project thread, Giulio
  - id: map-reduce-inputs
    description: >-
      An individual-responses input can be split into batches (batch auto or a size). Every persona
      of the step reads every batch in parallel (map), then answers the same questions from its own
      compact verdicts, adding combining layers until each request fits one Jev request (reduce).
      The last layer gives the step's votes, so later steps and reports work unchanged; earlier
      layers are kept in the run record. Only one input per step is batched, and only with
      individual responses.
    source:
      text: >-
        we might end up having to figure out some sort of like map reduce at some point if we if the size of our inputs is too big uh between steps where we cannot pass the outputs of what the previous step into the later step um we might have to basically kind of like actually create like a clone of all the steps into like a clone the steps of the second step. So for example if it was like board member eight board eight board members reviewing you know the outputs of like a thousand like cohorts, maybe it will have to be something like uh eight board board members review the first batch of like a hundred, another eight board members review like the batch of another a hundred, and so on and so forth in parallel and then you know eight board members and you ideally like then we can fit like the output of like those steps into like a single like thing but we w we'll have you know enough layers until it all fits in the input tokens.
      reference: 2026-10-09 jev-polls project thread, Giulio
  - id: jev-synthesis-step
    description: >-
      A study's unified final ranking comes from a Jev step, not app code: a synthesis persona
      receives the previous step's individual answers (for example every board member's vote) and
      returns one Choice distribution, read as a weighted ranking of the options.
    source:
      text: >-
        We um produce uh one final ranking but is like not eight rankings, is like one final unified ranking and we don't do this ourselves by the way we just do this by giving Jev the input like the output rankings from the previous uh step um And we produce if at least like you know basically a rank list with like uh weights effectively uh as the final output.
      reference: 2026-10-09 jev-polls project thread, Giulio
