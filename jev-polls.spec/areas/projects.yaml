id: projects
name: Projects and persistence
prose: >-
  A project groups a research brief with its cohorts, study, and run history. Drafts save locally
  with revision control. Open decision (not yet accepted): whether a project holds one study or
  many, and whether cohorts belong to one project or are shared across projects through tags or
  groups instead of project ownership. On 2026-10-09 the user leaned toward one study per project
  but saw cases for several, and questioned whether projects are needed at all versus tagging or
  grouping cohorts. Until that is decided, today's rules (one study per project, project-owned
  cohorts) stay in place. The general save model for other edits is still open.
behaviors:
  - id: create-project
    description: New project asks for a name and research brief, saves it, and opens its Studies tab.
  - id: rename-confirm
    description: >-
      Renaming a project uses an explicit confirm control, a check icon, that commits the new
      name; it is not autosaved.
    details: >-
      Saving depends on context. Short identity edits such as a project name are committed
      explicitly with a check icon. This behavior covers renames only; the save model for other
      edits remains an open decision.
    source:
      text: >-
        Depends on the context - if I'm renaming a project I would imagine I'd want a save button
        (mostly like a check icon)
      reference: 2026-10-09 jev-polls project thread, Giulio
  - id: project-ownership
    description: Every cohort and study belongs to exactly one project, and a study cannot use another project's cohort.
  - id: legacy-migration
    description: >-
      A workspace saved before projects existed opens under an "Existing research" project with
      every cohort and study preserved.
  - id: revision-safe-save
    description: >-
      Saves are atomic, increase the revision by one, and are refused when based on a stale
      revision.
    details: Concurrent saves from other processes are serialized; the browser's unsaved draft is never discarded by a refused save.
  - id: preserve-unsaved-edits
    description: Unsaved fields persist when switching sections, tabs, pages, or projects.
    source:
      text: Preserve unsaved fields when switching sections or pages
      reference: AGENTS.md
  - id: draft-export-import
    description: >-
      Data exports all projects, cohorts, and studies (including unsaved edits) as JSON and imports
      such a file for review before saving; exports exclude run history and credentials.
  - id: reload-saved
    description: Reload saved restores the last saved workspace and discards unsaved edits only after the user chooses it.
  - id: delete-project
    description: >-
      Deleting a project asks for confirmation, is blocked while one of its runs or drafts is
      active, and keeps its saved run reports reachable.
  - id: storage-limits
    description: >-
      A workspace holds up to 100 projects, 100 cohorts, 100 studies, 500 steps per study, and
      20,000 personas per cohort within 20 MiB, and every size the store accepts can be saved from
      the browser.
