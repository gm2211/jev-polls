id: projects
name: Projects and persistence
prose: >-
  A project holds a research brief, one or more studies, and their run history. Cohorts live in a
  shared workspace cohort library; projects link to the cohorts they use, so one cohort can serve
  several projects. Drafts save locally with revision control. Decided 2026-10-09: the user
  accepted the linked-library proposal (projects keep brief, studies, and runs; cohorts move to a
  shared library that projects link to). Decided 2026-10-10: edits are
  kept as local drafts automatically and reach the shared workspace only through one explicit
  Save.
behaviors:
  - id: create-project
    description: >-
      New project asks for a name and research brief, saves it, and opens a new empty study
      canvas (study-journey.project-lands-on-canvas).
  - id: rename-confirm
    description: >-
      Renaming a project uses an explicit confirm control, a check icon, that commits the new
      name; it is not autosaved.
    details: >-
      Saving depends on context. Short identity edits such as a project name are committed
      explicitly with a check icon. This behavior covers renames only.
    source:
      text: >-
        Depends on the context - if I'm renaming a project I would imagine I'd want a save button
        (mostly like a check icon)
      reference: 2026-10-09 jev-polls project thread, Giulio
  - id: rename-from-list
    description: >-
      Each project row on the projects list has a rename control that edits the name in place; the
      check icon saves it and a cancel control restores the row without changes.
    source:
      text: I should be able to rename project right here
      reference: 2026-10-09 jev-polls project chat, Giulio, on the project list row
  - id: list-times
    description: >-
      Project, study and cohort rows show when each was created and last updated in relative
      words ("today 1am", "1 day ago", "2 months ago"); run cards show when they started the same
      way. The exact time is in the hover title.
    details: >-
      The server stamps createdAt and updatedAt on Save from what actually changed; client-sent
      stamps are ignored. A project's updated time rolls up its own edits, its studies' and
      cohorts' edits and its latest run. Items saved before stamping existed fall back to a cohort's
      own createdAt and to run start times; Updated is omitted while it reads the same as Created.
    source:
      text: >-
        wanna see created and last updated .... Like "today 1am" or "1 day ago" or "2 months ago"
      reference: 2026-10-11 jev-polls project chat, Giulio, on the project list card
  - id: explicit-save
    description: >-
      Edits are committed to the shared workspace only by one Save action (button or Cmd/Ctrl+S);
      a single indicator shows when unsaved changes exist, and no section needs its own Apply.
    details: >-
      Short identity fields such as names keep their check-icon confirm (rename-confirm).
      Deleting a project, study or cohort is confirmed in a dialog and saved at once
      (list-pages-no-save). Cmd/Ctrl+S saves from any page.
    source:
      text: 1b 2a
      reference: >-
        2026-10-10 jev-polls project thread, Giulio, choosing option B for saving: explicit Save with automatic local drafts
  - id: list-pages-no-save
    description: >-
      The Projects, Studies, Cohorts and Runs lists have no Save button. Their own actions commit
      immediately: create and rename save on confirm, and a delete saves when its dialog is
      confirmed. Save appears only on pages that edit something (a study, a cohort, a persona,
      project settings).
    details: >-
      Changed 2026-10-11. Before, deleting from a list only changed the draft, so a Save button
      appeared beside New project with no visible edit to save. Unsaved edits made in an editor
      stay in the local draft when the user moves to a list page and are saved from that editor
      or with Cmd/Ctrl+S. A delete that fails to save leaves the error banner and the draft.
    source:
      text: save button for projects makes no sense - scan for other weird things like this
      reference: 2026-10-11 jev-polls project chat, Giulio, with a screenshot of the Projects list
  - id: unsaved-pill
    description: >-
      When the draft has unsaved edits and the current page has no Save button of its own (the
      lists), the top bar shows an "Unsaved changes" pill; clicking it saves.
    details: >-
      Chosen 2026-10-11 as the recommended answer to the open question raised with
      list-pages-no-save, under Giulio's standing approval to decide and ship in this project.
    source:
      text: for this repo merge deploy ship do whatever (for the scope of this project) without asking me
      reference: 2026-10-11 jev-polls project chat, Giulio
  - id: new-project-tile
    description: >-
      The Projects list ends with the same dashed New project tile the empty Studies list uses
      (plus icon, title, one-line hint, click anywhere to start); it replaces the header New
      project button and is also the empty state.
    source:
      text: should have the same for projects
      reference: >-
        2026-10-11 jev-polls project chat, Giulio, with a screenshot of the dashed New study tile
  - id: local-drafts-survive
    description: >-
      Unsaved edits are kept locally and automatically, so a refresh, a restart of the browser
      tab, or a server restart does not lose them.
    source:
      text: 1b 2a
      reference: >-
        2026-10-10 jev-polls project thread, Giulio, choosing option B for saving: explicit Save with automatic local drafts
  - id: project-ownership
    description: >-
      Every study and run belongs to exactly one project; cohorts belong to the shared library
      and are linked to projects rather than owned by them.
    source:
      text: 'for q1: I like your proposal'
      reference: >-
        2026-10-09 jev-polls project thread, Giulio, accepting the linked cohort library proposal
  - id: multiple-studies
    description: A project can hold several studies, each with its own flow, reviews, and runs.
    source:
      text: 'for q1: I like your proposal'
      reference: >-
        2026-10-09 jev-polls project thread, Giulio, accepting the linked cohort library proposal
  - id: shared-cohort-library
    description: >-
      The workspace keeps one cohort library. A project links existing library cohorts or creates
      new ones, and a study can use any cohort linked to its project.
    details: >-
      Editing a library cohort changes it for every project that links it; runs keep the cohort
      snapshot they used, so past results never change. Unlinking a cohort from a project does
      not delete it from the library.
    source:
      text: 'for q1: I like your proposal'
      reference: >-
        2026-10-09 jev-polls project thread, Giulio, accepting the linked cohort library proposal
  - id: legacy-migration
    description: >-
      A workspace saved before projects existed opens under an "Existing research" project with
      every cohort and study preserved.
  - id: revision-safe-save
    description: >-
      Saves are atomic, increase the revision by one, and are refused when based on a stale
      revision.
    details: Concurrent saves from other processes are serialized; the browser's unsaved draft is never discarded by a refused save.
  - id: preserve-unsaved-edits
    description: Unsaved fields persist when switching sections, tabs, pages, or projects.
    source:
      text: Preserve unsaved fields when switching sections or pages
      reference: AGENTS.md
  - id: draft-export-import
    description: >-
      Data exports all projects, cohorts, and studies (including unsaved edits) as JSON and imports
      such a file for review before saving; exports exclude run history and credentials.
  - id: reload-saved
    description: Reload saved restores the last saved workspace and discards unsaved edits only after the user chooses it.
  - id: delete-project
    description: >-
      Deleting a project asks for confirmation, is blocked while one of its runs or drafts is
      active, and keeps its saved run reports reachable.
  - id: storage-limits
    description: >-
      A workspace holds up to 100 projects, 100 cohorts, 100 studies, 500 steps per study, and
      20,000 personas per cohort within 20 MiB, and every size the store accepts can be saved from
      the browser.
