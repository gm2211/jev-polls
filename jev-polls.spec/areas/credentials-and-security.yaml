id: credentials-and-security
name: Credentials and security
behaviors:
  - id: key-storage
    description: >-
      Keys come only from environment variables (TYPESAFE_API_KEY, or a BYOS provider's own variable
      such as ANTHROPIC_API_KEY) or the OS credential store and
      never appear in arguments, project files, reports, exports, logs, browser storage, or chat.
  - id: verify-then-save
    description: >-
      Connecting TypeSafe verifies the key with one small request before saving it, and spends that
      request only when the key can be stored.
  - id: connect-never-runs
    description: Connecting an account never runs a study.
  - id: loopback-server
    description: >-
      By default the workspace binds to 127.0.0.1, rejects foreign Host and Origin headers, and
      requires a CSRF token on mutations.
  - id: hosted-server
    description: >-
      When a public URL is configured (JEV_POLLS_PUBLIC_URL or Render's RENDER_EXTERNAL_URL), the
      workspace binds all interfaces, accepts only that URL's Host and Origin, keeps the CSRF check,
      and requires a shared password of at least 12 characters (JEV_POLLS_PASSWORD) on every request
      except an unauthenticated /healthz.
    details: >-
      Hosted mode exists so the workspace can run on Render's free tier. The free instance sleeps
      after 15 idle minutes and loses local files on every sleep, restart or deploy, so the provided
      render.yaml runs in demo mode as a shareable demo. BYOS drafting keys can come from
      environment variables there because no Keychain exists.
    source:
      text: can we deploy to a free render tier
  - id: stopped-server-message
    description: When the local server stops, the page says the server is unreachable and that the API key is not at fault.
  - id: restarted-server-recovery
    description: >-
      When the local server restarts while a page is open, the page fetches the new CSRF token and
      retries the rejected request once, so saving keeps working without a manual reload. If the
      retry is still rejected, the page shows the expired-page message.
    source:
      text: I got an error about page expiring
