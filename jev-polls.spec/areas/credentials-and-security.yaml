id: credentials-and-security
name: Credentials and security
behaviors:
  - id: key-storage
    description: >-
      Keys come only from the TYPESAFE_API_KEY environment variable or the OS credential store and
      never appear in arguments, project files, reports, exports, logs, browser storage, or chat.
  - id: verify-then-save
    description: >-
      Connecting TypeSafe verifies the key with one small request before saving it, and spends that
      request only when the key can be stored.
  - id: connect-never-runs
    description: Connecting an account never runs a study.
  - id: loopback-server
    description: >-
      The workspace binds to 127.0.0.1, rejects foreign Host and Origin headers, and requires a CSRF
      token on mutations.
  - id: stopped-server-message
    description: When the local server stops, the page says the server is unreachable and that the API key is not at fault.
